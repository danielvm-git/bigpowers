# story: e58s07
Port 8888
Listen 0.0.0.0
Timeout 900
MaxClients 200
StartServers 5
MinSpareServers 5
MaxSpareServers 20
# Every client is a container on the internal network, so admit all of them and deny by destination.
Allow 0.0.0.0/0
DisableViaHeader Yes
# CONNECT is the only method that matters (the provider is https).
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
FilterURLs On
LogLevel Info
