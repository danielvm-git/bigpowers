id: ab-04
title: Fix the rate limiter window bugs
kind: bugfix
prompt: |
  Users report two problems with the rate limiter in src/limiter.js. Once the limit is
  reached, it never lets requests through again, even after the time window has passed.
  It also mishandles the window boundary: a request made exactly windowMs after the last
  reset must be allowed. Find the causes and fix them. `node test.js` must pass.
