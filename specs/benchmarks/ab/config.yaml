# story: e58s01 e58s04
# A/B eval config — read by scripts/run-ab-eval.sh. Arms and adapters are data:
# a trimmed bigpowers arm or a new harness is one entry here, not new code.
#
# Commands run with bash inside the temp workdir. Variables available:
#   $AB_PROMPT   task prompt        $AB_MODEL  --model value (may be empty)
#   $AB_WORKDIR  temp workdir       $AB_BP_ROOT  this bigpowers checkout
k: 3

arms:
  vanilla:
    setup: "true"
  bigpowers:
    # Skills, scripts/, specs/ folders and the CLAUDE.md/AGENTS.md seed in
    # arms/bigpowers/. Record any change to the seed: it is part of the result.
    setup: bash "$AB_BP_ROOT/scripts/lib/ab-arm-bigpowers.sh"
  # Ablations (e58s04): which part of bigpowers produces the gain. See ab-arm-bigpowers.sh.
  bp-core:
    # The seed plus only the six skills it names.
    setup: >-
      AB_BP_SKILLS=survey-context,plan-work,develop-tdd,verify-work,audit-code,fix-bug
      bash "$AB_BP_ROOT/scripts/lib/ab-arm-bigpowers.sh"
  bp-seed:
    # The seed instructions alone: no skills, no scripts.
    setup: AB_BP_SKILLS=none bash "$AB_BP_ROOT/scripts/lib/ab-arm-bigpowers.sh"
  bp-skills:
    # Every skill, no AGENTS.md/CLAUDE.md telling the agent to use them.
    setup: AB_BP_SEED=none bash "$AB_BP_ROOT/scripts/lib/ab-arm-bigpowers.sh"
  tdd-line:
    # Three plain lines of TDD discipline, no skills and no bigpowers names.
    setup: >-
      AB_BP_SKILLS=none AB_BP_SEED=specs/benchmarks/ab/arms/tdd-line/AGENTS.md
      bash "$AB_BP_ROOT/scripts/lib/ab-arm-bigpowers.sh"

adapters:
  claude:
    # --setting-sources project loads only the workdir's .claude/ (skills, CLAUDE.md),
    # so ~/.claude/skills (incl. a global bigpowers install), user CLAUDE.md, hooks and
    # plugins never reach either arm. --strict-mcp-config with no config drops MCP servers.
    # Uses your normal `claude` login; set AB_CLAUDE_CONFIG_DIR to use a separate one.
    command: >-
      env ${AB_CLAUDE_CONFIG_DIR:+CLAUDE_CONFIG_DIR="$AB_CLAUDE_CONFIG_DIR"}
      claude -p "$AB_PROMPT" --output-format json --permission-mode bypassPermissions
      --setting-sources project --strict-mcp-config
      --no-session-persistence ${AB_MODEL:+--model "$AB_MODEL"}
    parser: claude-json
  opencode:
    # OpenCode Go subscription: connect it once with `opencode auth login` → OpenCode Go.
    # Isolation: HOME and XDG_CONFIG_HOME point at the per-run empty $AB_HOME, so global
    # ~/.config/opencode (skills, AGENTS.md, plugins), ~/.claude and ~/.agents never load.
    # OPENCODE_DISABLE_CLAUDE_CODE=1 stops .claude/ duplicates: the bigpowers arm is read from
    # .agents/skills + AGENTS.md. XDG_DATA_HOME stays real: credentials (and session history)
    # live there. --auto approves tool calls inside the throwaway workdir.
    command: >-
      env HOME="$AB_HOME" XDG_CONFIG_HOME="$AB_HOME/.config"
      XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}" XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
      OPENCODE_DISABLE_CLAUDE_CODE=1
      opencode run --format json --auto -m "$AB_MODEL" "$AB_PROMPT"
    parser: opencode-jsonl
    default_model: opencode-go/deepseek-v4-pro  # 2026-11-02 smoke on ab-01: both arms pass, ~3x cheaper than kimi-k2.7-code
  gemini:
    # Not isolated from ~/.gemini yet: uninstall global bigpowers extensions first.
    command: gemini -p "$AB_PROMPT" --approval-mode yolo --output-format json ${AB_MODEL:+-m "$AB_MODEL"}
    parser: none
  codex:
    # Not isolated from ~/.codex yet: check for a global AGENTS.md first.
    command: codex exec --full-auto ${AB_MODEL:+-m "$AB_MODEL"} "$AB_PROMPT"
    parser: none
