source: >
  Research session 2026-07-23. Qwen Code has full hooks support with
  Claude-compatible event names (PreToolUse, PostToolUse, SessionStart).
  Also supports HTTP hooks, function hooks, and prompt hooks.
  Config at ~/.qwen/settings.json. Events: PreToolUse, PostToolUse,
  PostToolUseFailure, UserPromptSubmit, SessionStart, SessionEnd, Stop,
  SubagentStart, SubagentStop, PreCompact, PostCompact, Notification,
  PermissionRequest, TodoCreated, TodoCompleted, StopFailure.
integration_details:
  skills_path: ~/.qwen/skills/
  config_path: ~/.qwen/settings.json
  hooks: true
  hook_events: [PreToolUse, PostToolUse, PostToolUseFailure, UserPromptSubmit, SessionStart, SessionEnd, Stop, SubagentStart, SubagentStop, PreCompact, PostCompact, Notification, PermissionRequest, TodoCreated, TodoCompleted, StopFailure]
  hook_format: JSON (settings.json) + HTTP + Function + Prompt
  hook_events_count: 16
  naming_convention: Same as Claude Code (PreToolUse/PostToolUse)
