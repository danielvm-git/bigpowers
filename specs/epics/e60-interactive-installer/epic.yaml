stories:
  - id: e60s01
    title: Interactive installer with ASCII banner, global/local, tool selection
    status: done
    bcps: 3
    description: >
      Add an interactive installer that combines GSD's numbered-menu simplicity
      with BMAD's @clack/prompts visual polish. Features: ASCII banner,
      global vs local install choice, 15-runtime tool selection with paths,
      GSD-style progress output, auto-configured hooks.
    files:
      - bin/setup.js
      - scripts/lib/install-helpers.js
      - scripts/test-install-helpers.js
      - scripts/test-install-helpers.sh
      - scripts/lib/golden-suite-gates.sh
      - package.json (dependencies + bin + scripts)
    # Was `node bin/bigpowers.js setup (interactive in TTY)` — prose, not a
    # command, and unrunnable in CI by design. Assert the story's shipped
    # artifacts instead: helper suite green, helpers loadable, prompts wired.
    verify: >-
      bash scripts/test-install-helpers.sh &&
      node -e "require('./scripts/lib/install-helpers.js')" &&
      grep -q '@clack/prompts' bin/setup.js
    tags:
      - "story: e60s01"
