    verify: "test -f specs/benchmarks/golden/g-01.yaml && grep -q 'pass_at_k' specs/benchmarks/golden/g-01.yaml && grep -q 'minimal-api' specs/benchmarks/golden/g-01.yaml && echo OK"
  - id: 2
