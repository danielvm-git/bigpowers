id: e22
title: "Skill Catalog CI Gate"
wsjf: 5.5
bcps: 2
status: done
covers:
  - "Machine-runnable catalog health check via scripts/run-skill-verify.sh"
  - "CI integration that runs skill verification on push and blocks regression"
rationale: "BV=9 (every PR gets skill health check), TC=6 (pre-ship quality gate), RR=4 (automated, low risk), JS=2 (2 BCPs — script + CI wiring)"
stories:
  - id: e22s01
    title: "scripts/run-skill-verify.sh — machine-runnable catalog health check"
    bcps: 1
    status: done
    tasks:
      - desc: "Write scripts/run-skill-verify.sh — extract and run each SKILL.md → verify: command"
        verify: "bash scripts/run-skill-verify.sh 2>&1 | grep -qE '^PASS|^SKIP' && echo OK || echo FAIL"
      - desc: "Add SKIP logic for skills with no → verify: line; exit 0 only if zero FAILs"
        verify: "bash scripts/run-skill-verify.sh; echo \"exit: $?\""
  - id: e22s02
    title: "Wire skill-verify to CI and stocktake-skills --verify mode"
    bcps: 1
    status: done
    tasks:
      - desc: "Add skill-health job to .github/workflows/ci.yml running run-skill-verify.sh"
        verify: "grep -q 'run-skill-verify' .github/workflows/ci.yml && echo OK || echo FAIL"
      - desc: "Add --verify mode section to stocktake-skills/SKILL.md that invokes run-skill-verify.sh"
        verify: "grep -c '\\-\\-verify\\|verify.*mode' stocktake-skills/SKILL.md | awk '{if($1>=1) print \"OK\"; else print \"FAIL\"}'"
