id: e38
title: "Spec-to-Code Traceability Gate"
wsjf: 3.50
bcps: 13
status: proposed
release: v2.45.0
codename: "Deepening"
source: |
  Market survey of 5 tools (2026-07-02):
  - spec-kit: inline [Story] labels in task checkboxes
  - speckit-utils: keyword matching FRs → tasks → files
  - spec-kit V-Model: deterministic build-matrix.sh, 5 matrices, bidirectional
  - BMAD TEA: 4-tier oracle fallback (formal → spec → external → synthetic),
    P0-P3 prioritization, heuristic blind-spot detection, deterministic gate
    (PASS/CONCERNS/FAIL/WAIVED), machine-readable JSON for CI/CD
  - bigpowers trace-requirement: story tags in code → grep → matrix (current, fragile)
  Article: "The Agentic Coding Stack — 5 Layers and the Missing Link Nobody Has Built Yet"
  The gap: nobody tracks a requirement through design → implementation → tests → ongoing change.
  bigpowers is closest to building this bridge with trace-requirement + execution-status.
  TEA's synthetic-oracle confidence downgrade and heuristic blind-spot detection are the
  key innovations to port.

stories:
  - id: e38s01
    bcp: 3
    title: "Create scripts/trace-stories.sh — deterministic coverage matrix builder"
    verify: test -f scripts/trace-stories.sh && bash scripts/trace-stories.sh --help >/dev/null 2>&1 && echo OK
    description: |
      Parse specs/release-plan.yaml + specs/execution-status.yaml → grep for story: tags in
      codebase → cross-reference → produce coverage matrix.
      Emit specs/traceability-matrix.json (machine-readable) +
      specs/TRACEABILITY_LATEST.md (human-readable).
      Oracle resolution: story tags (high confidence) → file-name heuristics (medium) →
      epic capsule task refs (low). Flag dark stories, orphan tags, stale tags.
      --strict flag for CI: non-zero exit if P0 stories have 0% code coverage.

  - id: e38s02
    bcp: 1
    title: "Integrate trace-stories.sh into build-epic Step 8 (verify phase)"
    verify: grep -q 'trace-stories.sh' skills/build-epic/SKILL.md && echo OK
    description: |
      Add trace-stories.sh invocation to build-epic SKILL.md Step 8 so every epic
      completion automatically generates the trace matrix. Run before verify-work.

  - id: e38s03
    bcp: 1
    title: "Add trace-stories.sh --strict to CI gate (sync-skills.yml)"
    verify: grep -q 'trace-stories.sh' .github/workflows/sync-skills.yml && echo OK
    description: |
      Add a CI step that runs scripts/trace-stories.sh --strict --json on push.
      Fails CI if P0 stories have no code tags. Uploads traceability-matrix.json as
      a build artifact.

  - id: e38s04
    bcp: 2
    title: "Create scripts/check-blind-spots.sh — heuristic quality detector"
    verify: test -f scripts/check-blind-spots.sh && bash scripts/check-blind-spots.sh --help >/dev/null 2>&1 && echo OK
    description: |
      Structural quality checks beyond percentage coverage (TEA-inspired):
      - verify-gap: story done but no verify command executed
      - test-gap: code tagged for story, no test file references
      - epic-orphan: task in capsule has no story tag anywhere
      - stale-tag: story done in execution-status but tag still in code
      - double-tag: same file tagged with multiple stories
      - bootstrap-testless: new story without test tag
      Emits specs/blind-spots.json with severity (HIGH/MEDIUM/LOW) and
      remediation hints.

  - id: e38s05
    bcp: 1
    title: "Integrate check-blind-spots.sh into verify-work Phase 3"
    verify: grep -q 'check-blind-spots.sh' skills/verify-work/SKILL.md && echo OK
    description: |
      Run blind-spot checks during verification. Surface findings in verify-work report.
      HIGH severity findings block the verify-work PASS gate.

  - id: e38s06
    bcp: 2
    title: "Create gate-trace skill — deterministic quality gate before release"
    verify: test -f skills/gate-trace/SKILL.md && echo OK
    description: |
      New skill directory: skills/gate-trace/SKILL.md.
      Reads specs/traceability-matrix.json + specs/blind-spots.json.
      Gate decision (deterministic, auditable):
      - Any undo story has 0 code tags → FAIL
      - Any story done but no verify → CONCERNS
      - P0 story 0% coverage → FAIL
      - Overall < 60% → CONCERNS
      - Overall ≥ 80% + no critical gaps + all verify → PASS
      Oracle confidence downgrade (TEA-inspired):
      - > 50% trace links from heuristics (not explicit tags) → one level downgrade
      - > 80% from heuristics → two levels (PASS→FAIL, CONCERNS→FAIL)
      Output: gate decision + rationale to stdout + specs/execution-status.yaml.

  - id: e38s07
    bcp: 1
    title: "Wire gate-trace into release-branch pre-PR gate"
    verify: grep -q 'gate-trace' skills/release-branch/SKILL.md && echo OK
    description: |
      Add gate-trace invocation to release-branch SKILL.md before PR creation.
      FAIL blocks merge. CONCERNS requires explicit human override in state.yaml.

  - id: e38s08
    bcp: 1
    title: "Update CLAUDE.md and CONVENTIONS.md with traceability mandate"
    verify: grep -q 'traceability' CLAUDE.md && grep -q 'traceability' CONVENTIONS.md && echo OK
    description: |
      Add traceability mandate to CONVENTIONS.md under Agent Workflow Mandates:
      "Traceability Mandate: Every story MUST have at least one // story: eNNsNN tag
      in its implementing code or test file. trace-stories.sh --strict runs in CI."
      Add trace-stories.sh to CLAUDE.md Commands table.

  - id: e38s09
    bcp: 1
    title: "Write docs/references/traceability-gate.md — architecture & operator guide"
    verify: test -f docs/references/traceability-gate.md && grep -q 'TEA\|oracle confidence\|blind-spot' docs/references/traceability-gate.md && echo OK
    description: |
      Reference doc explaining the three-tier architecture (matrix → blind-spots → gate),
      the oracle resolution tiers, heuristic blind-spot catalog, gate decision rules,
      CI/CD integration points, and how to interpret/override results.
      Include provenance: market survey date, TEA inspiration, article reference.
