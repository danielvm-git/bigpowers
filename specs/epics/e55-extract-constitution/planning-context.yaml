# planning-context.yaml — written by elaborate-spec (yolo mode, 2026-07-22); consumed by plan-work
# Epic e55 — Extract Constitution. Provisional epic elaborated autonomously; interpretations
# resolved by the driver and recorded under key_decisions (no interactive dialogue occurred).
feature_name: "Extract Constitution — consolidate bigpowers doctrine into one file"

problem_statement: |
  bigpowers states its own rules in many places at once — CLAUDE.md, CONVENTIONS.md,
  docs/PRINCIPLES.md, and roughly two dozen docs/references/*.md files. The same rule is
  often restated in several of them, so they drift: a rule updated in one file stays stale in
  another, and no single file is authoritative. bigspec's constitution.md solves this by being
  the ONE place principles are stated ("if a rule appears in two files, this one wins and the
  other is a bug"); everything else references it. This epic gives bigpowers that same single
  source of rules, structured as bigspec's 11 blocks (B0-B10) plus the Capstone, WITHOUT
  changing any underlying rule — a reorganization, not a rewrite.

actors:
  - who: "skill authors"
    role: "reference the constitution from a SKILL.md instead of restating a rule inline"
  - who: "the agent (at runtime)"
    role: "reads the constitution as the authoritative rule source"
  - who: "repo maintainer"
    role: "amends the constitution via ADR; owns the single source of rules"
  - who: "e56 (reclassify-catalog)"
    role: "downstream consumer — needs a constitution to move rule-classified skill content INTO"

main_flow: |
  1. Audit every current doctrine source (CLAUDE.md, CONVENTIONS.md, docs/PRINCIPLES.md, every
     docs/references/*.md) and map each rule to exactly one of bigspec's B0-B10 + Capstone
     blocks — produce the mapping table before writing anything, modeled on bigspec's own
     architecture.md §13.3 "layer cake -> construction order" table.
  2. Write bigpowers/constitution.md from that mapping. Additive: CLAUDE.md and CONVENTIONS.md
     stay exactly as they are during this step — the constitution is a new consolidated view,
     not yet a replacement.
  3. Once the constitution is verified complete and accurate against real skill behavior, add
     pointers from CLAUDE.md/CONVENTIONS.md to it (the "one rule, one home" discipline this
     project's own T18 wayfinder ticket already established for AGENTS.md).

success_criteria:
  - |
    GIVEN doctrine is scattered across CLAUDE.md, CONVENTIONS.md, PRINCIPLES.md, and the
      references docs today
    WHEN this epic completes
    THEN a single constitution.md exists carrying all 11 blocks (B0-B10) plus the Capstone,
      and every current rule maps to exactly one block
  - |
    GIVEN the "one rule, one home" invariant
    WHEN any rule is checked
    THEN it is stated in exactly one place; any other file that mentions it points to the
      constitution rather than restating it
  - |
    GIVEN existing tooling and contributors read CLAUDE.md/CONVENTIONS.md directly today
    WHEN this epic completes
    THEN those files still work — the epic adds a consolidated source and cross-references,
      it does not remove content out from under existing readers

constraints:
  - "No rule content changes — reorganization, not rewrite. A changed rule is a bug in this epic."
  - "Must follow bigspec's exact B0-B10 + Capstone block structure, so e59 can later diff bigpowers' constitution against bigspec's as it evolves."
  - "Backward compatibility: CLAUDE.md and CONVENTIONS.md keep working for any tooling or contributor workflow that reads them directly."
  - "Depends on e54 (frozen catalog baseline) so the rule-source audit isn't chasing skill changes mid-epic."

out_of_scope:
  - "Changing the content or meaning of any rule (this is consolidation only)."
  - "Deleting or gutting CLAUDE.md / CONVENTIONS.md — full retirement of the old files, if ever, is a separate later decision."
  - "Introducing a constitution_version / SemVer amendment scheme for the constitution — that compatibility-tracking concern belongs to e59 (absorb-fresh-references)."
  - "Moving rule-classified skill CONTENT into the constitution — that is e56's job; e55 only builds the destination and its structure."

key_decisions:
  - decision: "Additive-first: create a new constitution.md and point the old files at it, rather than replacing CLAUDE.md/CONVENTIONS.md in this epic."
    rationale: |
      The request 'extract constitution' admits two readings: (A) create a new consolidated
      constitution.md and keep the existing files as pointers, or (B) fully replace
      CLAUDE.md/CONVENTIONS.md with it. Chose A. It protects every existing reader/tool (zero
      backward-compat risk), and it mirrors exactly how this project's own T18 wayfinder ticket
      already resolved the analogous AGENTS.md case (canonical file + pointers, no destructive
      delete). Full retirement can be decided later on evidence, not assumed now.
  - decision: "Structure bigpowers' constitution on bigspec's B0-B10 + Capstone exactly, not a bigpowers-invented block layout."
    rationale: |
      The whole migration's point is convergence on bigspec as north-star. Using bigspec's
      exact block structure is what makes e59's ongoing 'diff against bigspec' sync mechanism
      possible at all — a bigpowers-specific layout would defeat the sequence's own endpoint.

