id: e55
title: "Extract Constitution — Consolidate Doctrine into One File"
wsjf: 6.0
bcps: 0
bcps_projected: 7
capsule_dir: epics/e55-extract-constitution
mode: capsule
status: scoped
elaborated: 2026-07-22
elaboration: planning-context.yaml
depends_on: [e54]
source: |
  Third phase of the bigpowers-to-bigspec migration sequence (state.yaml's 6-phase list:
  freeze-catalog-drift, extract-constitution, reclassify-catalog, adopt-okf-envelope,
  evals-over-compliance, absorb-fresh-references). bigspec's constitution.md is the single
  source of rules (B0-B10 + Capstone) that "skills, kernel, and scaffold reference; they
  never restate" — the direct opposite of bigpowers' current ~27 scattered reference docs
  (docs/PRINCIPLES.md, docs/references/*.md, CONVENTIONS.md, CLAUDE.md), which
  architecture.md §1 verdicts DROP ("They mostly restate CONVENTIONS + PRINCIPLES — the
  layer-cake lives as a single narrative, not 27 parallel files"). This epic consolidates
  bigpowers' own doctrine into one constitution.md following bigspec's exact B0-B10 +
  Capstone structure, without changing any of the underlying rules — a reorganization, not
  a rewrite.
note: >
  WSJF 6.0 = (6 value + 6 urgency + 6 risk-reduction) / 3 job-size. Foundational for
  everything after it: e56 (reclassify-catalog) needs somewhere to move rules TO once
  they're separated from procedures; e57 (adopt-okf-envelope) cites B8 directly.
  Provisional epic — NOT YET SCOPED. bcps: 0 reflects zero real, counted stories (B9:
  "BCP is a sum of per-dimension element sizes, never hand-stamped as a gestalt" — no
  story has been sliced yet, so there is nothing real to sum). bcps_projected is a rough
  planning estimate only, not a BCP count. Run elaborate-spec on this epic before slicing
  real stories with plan-work.
stories: []
planned_stories:
  - working_title: "Map every current doctrine source to a B0-B10 + Capstone block"
    bcp_estimate: 2
    description: >
      Audit CLAUDE.md, CONVENTIONS.md, docs/PRINCIPLES.md, and every docs/references/*.md
      file; for each rule, determine which of bigspec's 11 blocks (B0 Token/Context Substrate
      through B10 Synthesis, plus Capstone) it belongs to. Produces a mapping table before any
      file is written — the "13.3 layer cake → construction order" table in bigspec's own
      architecture.md is the model to follow.
    backward_compat: >
      Read-only audit — no existing file changes yet. Zero risk to current users.
  - working_title: "Write constitution.md from the mapping, CLAUDE.md/CONVENTIONS.md unchanged"
    bcp_estimate: 3
    description: >
      Write bigpowers/constitution.md following the mapping from the first story. CLAUDE.md
      and CONVENTIONS.md stay exactly as they are during this story — constitution.md is
      additive, a new consolidated view, not a replacement yet.
    backward_compat: >
      Purely additive (new file). No existing contributor-facing file changes, no skill
      behavior changes. Zero risk to current users or published bigpowers behavior.
  - working_title: "Point CLAUDE.md/CONVENTIONS.md at constitution.md, don't delete them yet"
    bcp_estimate: 2
    description: >
      Once constitution.md is verified complete and accurate (spot-checked against real
      skill behavior), add pointers from CLAUDE.md/CONVENTIONS.md to it, following the same
      "one rule, one home" discipline this session's T18 ticket already established for
      AGENTS.md. Full retirement of the old files (if ever) is a separate, later decision —
      out of scope for this story.
    backward_compat: >
      CLAUDE.md/CONVENTIONS.md keep working exactly as before for any tooling or contributor
      workflow that reads them directly — this story adds cross-references, it does not
      remove content out from under existing readers.
