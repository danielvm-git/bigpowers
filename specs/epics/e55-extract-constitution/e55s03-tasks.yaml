    verify: "grep -qi 'constitution.md' CONVENTIONS.md && grep -qi 'fully authoritative' CONVENTIONS.md && echo OK"
    risk: P2
    status: passing
    allure:
      severity: normal
      categories:
        - "Constitution"
        - "documentation"
  - id: 3
    description: "Confirm no existing line in CLAUDE.md or CONVENTIONS.md was removed or modified — this story only inserts new lines (diff must show 0 deletions of pre-existing lines, only additions)."
    verify: "for f in CLAUDE.md CONVENTIONS.md; do d=$(git diff --numstat -- \"$f\" | awk '{print $2}'); test \"${d:-0}\" -eq 0 || exit 1; done; echo OK"
    risk: P2
    status: passing
    allure:
      severity: normal
      categories:
        - "Constitution"
        - "scope-guard"
  - id: 4
    description: "Confirm story: e55s03 tag present in both files' header tag blocks."
    verify: "grep -q 'story: e55s03' CLAUDE.md && grep -q 'story: e55s03' CONVENTIONS.md && echo OK"
    risk: P2
    status: passing
    allure:
      severity: normal
      categories:
        - "Constitution"
        - "integration"
  - id: 5
    description: "Confirm scripts/decompose-conventions.sh still runs cleanly against the modified CONVENTIONS.md."
    verify: "bash scripts/decompose-conventions.sh >/dev/null 2>&1; test $? -eq 0 && echo OK"
