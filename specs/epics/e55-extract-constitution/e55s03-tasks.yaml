    description: "Add a pointer section near the top of CLAUDE.md noting constitution.md exists as the consolidated doctrine entry point, stating CLAUDE.md remains fully authoritative for its own content today."
    verify: "grep -qi 'constitution.md' CLAUDE.md && grep -qi 'fully authoritative' CLAUDE.md && echo OK"
