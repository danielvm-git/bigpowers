stories:
  - id: e36s01
    bcp: 3
    title: "Slim docs/references/uncle-bob.md to provenance pointer"
    verify: wc -l docs/references/uncle-bob.md | awk '{if($1<20) print "OK: slimmed"; else print "FAIL: "$1" lines"}'
  - id: e36s02
    bcp: 3
    title: "Slim docs/references/akita.md, ousterhout.md, karpathy.md, wasowski.md to provenance pointers"
    verify: for f in akita ousterhout karpathy wasowski; do wc -l docs/references/$f.md | awk '{if($1>30) print "FAIL: '\''$f'\'' still long"}'; done && echo OK
  - id: e36s03
    bcp: 2
    title: "Remove F.I.R.S.T rubric restatement from enforce-first and audit-code SKILL.md; replace with CONVENTIONS.md pointer"
    verify: grep -c 'Fast.*Independent.*Repeatable' skills/enforce-first/SKILL.md skills/audit-code/SKILL.md | awk -F: '{sum+=$2} END{if(sum<=1) print "OK"; else print "FAIL: "sum}'
  - id: e36s04
    bcp: 2
    title: "Update docs/references/spec-kit.md to cover full SDD tool landscape (Kiro, Tessl, BMAD, GSD)"
    verify: grep -q 'Kiro|Tessl' docs/references/spec-kit.md && echo OK
