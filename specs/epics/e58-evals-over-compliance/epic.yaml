planned_stories:
  - working_title: "Extend run-evals to cover a meaningful skill subset with real with/without-skill deltas"
    bcp_estimate: 3
    description: >
      bigpowers' existing run-evals skill and specs/benchmarks/ harness already do
      with/without-skill delta grading (pass@k + token cost) for individual skill evolution
      (evolve-skill's own gate). This story extends coverage to a broad enough slice of the
      catalog that a genuine aggregate signal exists to compare against the 94% compliance
      number — not full 100% coverage on day one, a real representative sample.
    backward_compat: >
      Purely additive (new eval runs, new data) — the existing compliance gate keeps running
      unchanged and unblocked throughout this story. No published behavior changes.
  - working_title: "Run evals alongside compliance for a calibration period, collect false-positive data"
    bcp_estimate: 3
    description: >
      Per architecture.md §10's own explicit red-team guidance ("ship risk-tiered gates
      advisory-first, promote to BLOCKER only after calibration data") — do NOT flip
      golden-suite-gates.sh:9 yet. Run both gates in parallel for a defined period, log
      where they agree/disagree, and only then decide the eval threshold that replaces "94%."
    backward_compat: >
      Compliance stays the active, blocking gate throughout — evals run alongside as pure
      observation. Zero risk to CI or to what currently gets merged.
  - working_title: "Demote compliance to advisory once calibration data supports it"
    bcp_estimate: 3
    description: >
      Using e53s03's GOLDEN-COMPLIANCE-DEPENDENCY.md dependency map, flip
      scripts/lib/golden-suite-gates.sh:9's is_optional flag and update every one of the 5
      docs that cite the 94% threshold as a Hard Stop, per what that map already found needs
      to change. This is the single action e53s03 explicitly scoped itself out of — this
      story is where it actually happens, once — and only once — the prior story's
      calibration data justifies it.
    backward_compat: >
      This is the one genuinely gate-behavior-changing story in the epic — mitigated by
      being the last story, gated on real calibration data (prior story), and grounded in
      an exhaustive pre-built dependency map (e53s03) rather than a guess at what breaks.
  - working_title: Harness-neutral headless eval runner that fills pending_agent_eval
    bcp_estimate: 26
    bcp_basis: 13D element count, 2026-10-30
    description: >-
      Run each eval prompt headless through a harness adapter (Claude, Gemini, Codex), grade with the eval's
      verify commands, and record pass@k with and without the skill. Fills run-benchmark.py's pending_agent_eval
      scenarios. Added 2026-10-30 from the playbook value-engineering pass (red-team verdict R1: merge into
      e58, keep advisory until calibrated).
    backward_compat: >-
      Additive: the runner only produces eval data; the compliance gate stays blocking until the calibration
      story decides otherwise.
