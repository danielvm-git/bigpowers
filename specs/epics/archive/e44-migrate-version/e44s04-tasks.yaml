id: e44s04
title: "Verification gates + migration report generation + CLAUDE.md/CONVENTIONS.md staleness check"

tasks:
  - id: s04-t01
    description: "Implement per-migration verify block execution: run verify: commands for each applied migration, track pass/fail"
    verify: 'grep -q ''verify.*block\|run_verify\|verify.*pass\|verify.*fail'' scripts/migrate-version.sh && echo OK'
    story: e44s04

  - id: s04-t02
    description: "Run global validate-specs-yaml.sh as final gate after all migrations applied"
    verify: "grep -q 'validate-specs-yaml' scripts/migrate-version.sh && echo OK"
    story: e44s04

  - id: s04-t03
    description: "Run validate-okf.sh against specs/migrations/ if available (e40s06 dependency — soft gate)"
    verify: "grep -q 'validate-okf' scripts/migrate-version.sh && echo OK"
    story: e44s04

  - id: s04-t04
    description: "Implement CLAUDE.md staleness check: compare downstream copy against bigpowers template, report line delta"
    verify: 'grep -q ''CLAUDE.md\|staleness\|behind'' scripts/migrate-version.sh && echo OK'
    story: e44s04

  - id: s04-t05
    description: "Implement CONVENTIONS.md staleness check: same comparison pattern"
    verify: "grep -q 'CONVENTIONS.md' scripts/migrate-version.sh && echo OK"
    story: e44s04

  - id: s04-t06
    description: "Generate specs/migration-report-<ISO8601>.md with all 9 sections (gap summary, migrations, manual steps, uncertainties, skipped, verification, staleness, next steps, rollback)"
    verify: 'grep -q ''migration-report\|report.*template\|rollback'' scripts/migrate-version.sh && echo OK'
    story: e44s04

  - id: s04-t07
    description: "Print terminal summary: version transition, applied/skipped counts, ⚠ count, staleness notice, report path, sync-skills reminder"
    verify: 'grep -q ''Migration complete\|applied\|uncertain\|behind\|sync-skills'' scripts/migrate-version.sh && echo OK'
    story: e44s04
