    description: >-
      Choose the showcase app (utility with genuine logic, not a todo list)
      and create the public repo danielvm-git/bigpowers-showcase with gh
    verify: >-
      (gh repo view danielvm-git/bigpowers-showcase --json name -q .name 2>/dev/null
      | grep -q showcase && echo OK)
      || (test -d ../bigpowers-showcase/.git && echo "OK: local clone found")
      || echo "PENDING: offline, verify manually"
    status: done
  - id: 2
    description: >-
      Run seed-conventions + scope-work + plan-release in the showcase repo;
      commit the full specs/ cockpit (state.yaml, release-plan.yaml, product/)
      from day one
    verify: >-
      (gh api repos/danielvm-git/bigpowers-showcase/contents/specs
      --jq 'length' 2>/dev/null | awk '{if($1>0) print "OK"}')
      || (test -d ../bigpowers-showcase/specs && echo "OK: local checkout verifies")
      || echo "PENDING: offline, verify manually"
    status: done
