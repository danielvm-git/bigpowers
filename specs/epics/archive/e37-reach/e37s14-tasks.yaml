      grep -qi 'Codex CLI' skills/seed-conventions/REFERENCE.md &&
      grep -q 'config.toml' skills/seed-conventions/REFERENCE.md &&
      python3 -c "import tomllib, re, pathlib; t=pathlib.Path('skills/seed-conventions/REFERENCE.md').read_text(); m=re.search(r'```toml\\n(.*?)```', t, re.S); tomllib.loads(m.group(1)) if m else (_ for _ in ()).throw(SystemExit(1))" &&
      echo OK
    risk: P2
    security: none
    status: todo

