story_id: e31s02
title: "Wire npm run compliance into CI as pre-release gate"
status: todo
bcps: 2
tasks:
  - id: 1
    description: "Add compliance step to publish.yml release job before semantic-release"
    verify: "grep -qE '^\\s*run:.*npm run compliance' .github/workflows/publish.yml && echo OK"
  - id: 2
    description: "Verify compliance step is positioned before the Release step"
    verify: "grep -A1 'npm run compliance' .github/workflows/publish.yml | tail -1 | grep -q 'Release' || echo 'compliance before release'"
  - id: 3
    description: "Dry-run: ensure npm run compliance exits 0 locally"
    verify: "npm run compliance && echo OK"
