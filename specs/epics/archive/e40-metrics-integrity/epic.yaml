  - id: e40s05
    bcp: 3
    title: "DORA four keys per story, computed from git/deploy events (lead time, deploy frequency, change failure, restore time) — median/rate aggregation only"
    spec: e40s05-dora-four-keys.md
    tasks: e40s05-tasks.yaml
