id: e40
title: "Metrics Integrity — Honest, Additive, Benchmarkable"
wsjf: 3.2
bcps: 18
status: done
release: v2.45.0
codename: "Deepening"
supersedes: e35
source: |
  Session 2026-07-03 — cycle-time metric investigation. Findings:
  - specs/metrics/cycle-times.yaml is unreliable: agent-self-reported wall-clock,
    hand-computed, ungated. Outliers (bcp_per_hour up to 120), templated blocks
    (11× identical 45-min/1.3 rows), three e13 stories sharing start+end.
  - Root cause is a SELF-REPLICATING methodology defect: survey-context stamps
    story_start, release-branch stamps story_end + hand-arithmetic. Because
    bigpowers was built with bigpowers, every downstream project inherits it.
  - Wall-clock ≠ effort (includes overnight/weekend/UAT wait). One number cannot
    mean both "how long it took" and "how hard I worked".
  Research + red-team (2× adversarial passes) established the fix, captured in:
  - specs/RESEARCH-cycle-time-metrics.md — primary-source survey
  - specs/templates/story-metrics.okf.md — per-story OKF metrics bundle.
  - scripts/record-cycle-time.sh — git-derived, additive effort + lead time
  Design decisions locked:
  - Two SEPARATED per-story fields: effort (idle-stripped, ADDITIVE, Σ=total)
    and lead_time (calendar latency, median-aggregated, NEVER summed).
  - Additive effort requires a GLOBAL commit partition (not per-story git-hours
    summed — that leaks both directions; proven by simulation).
  - Telemetry-first: where the harness exposes usage (pi, Claude Code) capture
    tokens/cost/duration (naturally additive); git-effort is the portable
    fallback (Cursor/Gemini).
  - Gate on PROVENANCE (script ran, commit_range resolves), never on a value.
