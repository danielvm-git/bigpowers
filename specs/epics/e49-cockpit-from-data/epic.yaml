  delta: ADDED
  depends_on: []
  description: >-
    Tracer bullet. skills/visual-dashboard/scripts/cockpit-model.cjs builds the cockpit model (schema
    bigpowers/cockpit@1) from the project's own specs/ YAML and git log, using js-yaml which the package
    already ships. visual-dashboard computes it on each /api/cockpit request, cached by a fingerprint
    of git HEAD and the specs/ files it read. cockpit.html renders the epic board: 100 rows e00-e99, unused
    numbers kept as empty rows, steps Scoped/Capsule/Tasks/Test plan/Threat model/Built/Audited/Status,
    BCP, WSJF, open bugs. Nothing is built, committed or typed by hand; the Python prototype extractor
    is a test oracle only and is not shipped.
  files:
