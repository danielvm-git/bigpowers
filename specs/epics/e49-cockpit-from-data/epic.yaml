# story: e49s01 e49s02 e49s03 e49s04 e49s05 e49s06 e49s07 e49s08 e49s09 e49s10
id: e49
title: Cockpit From the Data — Live in Every Project, No Build
wsjf: 2.6
bcps: 221
capsule_dir: epics/e49-cockpit-from-data
mode: capsule
status: scoped
sliced: '2026-11-03'
wsjf_rationale: BV 8 + TC 6 + RR 7 / Job 8 ≈ 2.6
source: >-
  Today three cockpit surfaces (visual-dashboard, the dashboard/ package, an unmerged cps-cockpit) each
  re-read the hand-maintained YAML, show contradicting sources side by side without flagging them, and
  no gate asserts their numbers. The seventh-layer rules apply: every number answers a question and carries
  a goal, nothing is retyped, and a metric not measured yet is declared PLANNED. One deterministic model,
  computed live inside each project by the shipped visual-dashboard skill, feeds every view: a solo developer
  runs `bigpowers cockpit` and never builds or runs Preflight to see fresh numbers. Prototype: https://claude.ai/artifact/2g8uM6Fhb2R6DMQoqDVL5Q.
scope_ref: specs/product/SCOPE_LATEST.yaml fr-07 (YAML specs cockpit)
related:
- e83 fixes the drift that e49s03 and e49s04 detect
- e85 recounts these BCP with the 13D procedure
out_of_scope:
- a committed or prebuilt cockpit.json — the model is computed on request
- check-status CLI (not in this repository)
- portfolio, margin or multi-project views
- writing to specs/ from the cockpit — it stays read-only
