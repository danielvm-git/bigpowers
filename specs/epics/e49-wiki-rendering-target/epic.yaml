id: e49
title: "GitHub Wiki as Derived OKF Rendering Target"
wsjf: 2.4
bcps: 8
status: proposed
mode: capsule
capsule_dir: epics/e49-wiki-rendering-target
source: |
  Treat the GitHub Wiki strictly as a derived rendering target for OKF bundles via a CI/CD bridge.
  All documentation is authored in the main repo as structured OKF. On merge to main, a GitHub
  Action triggers `validate-okf`, and if successful, runs a new `publish-to-wiki` kernel tool.
  Closes the gap between machine-readable OKF (B4) and human-readable documentation without
  violating the single source of truth.
release: v2.9x
codename: "Human Bridge"

stories:
  - id: e49s01
    bcp: 3
    title: "Create publish-to-wiki kernel tool"
    status: todo
    risk: P1
    verify: test -f kernel/src/publish-to-wiki.sh && bash kernel/src/publish-to-wiki.sh --help && echo OK
    tasks:
      - description: "Map OKF kinds to wiki sections, render Markdown, rewrite relative links, push to .wiki.git"
        verify: "bash kernel/src/publish-to-wiki.sh --dry-run"
        ac: |
          Given an OKF bundle in specs/
          When publish-to-wiki runs
          Then it rewrites local links to wiki slug format
          And it pushes to the configured wiki git repo

  - id: e49s02
    bcp: 1
    title: "Add GitHub Action Template for publish-wiki.yml"
    status: todo
    risk: P1
    verify: test -f .github/workflows/publish-wiki.yml && grep -q 'publish-to-wiki' .github/workflows/publish-wiki.yml && echo OK
    tasks:
      - description: "Create workflow that runs on main merge, gates on validate-okf, then runs publish-to-wiki"
        verify: "cat .github/workflows/publish-wiki.yml"
        ac: |
          Given a merge to main
          When the publish-wiki action runs
          Then it must run validate-okf first
          And it must fail if validate-okf fails
          And it requires a PAT for wiki push

  - id: e49s03
    bcp: 2
    title: "Create Wiki Scaffold Templates and provenance header injection"
    status: todo
    risk: P2
    verify: test -f kernel/templates/wiki/_Sidebar.md && echo OK
    tasks:
      - description: "Create default _Sidebar.md, _Footer.md, and Home.md and provenance injection logic"
        verify: "grep -q 'AUTO-GENERATED FROM OKF BUNDLES' kernel/templates/wiki/header.md || echo pending"
        ac: |
          Given a wiki page template
          When it is rendered
          Then it contains a prominent warning not to edit it directly

  - id: e49s04
    bcp: 2
    title: "Extend bigspec init with --with-wiki flag"
    status: todo
    risk: P2
    verify: "grep -q 'with-wiki' bin/bigspec || echo pending"
    tasks:
      - description: "Seed the wiki repo on first run, handling uninitialized wiki edge case"
        verify: "echo 'Check init flow'"
        ac: |
          Given a fresh project
          When bigspec init --with-wiki is called
          Then it handles the uninitialized wiki edge case via instructions or API
