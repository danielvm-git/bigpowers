id: e45
title: "OKF Completion — Wikis, Verification Reports, Viz Graph"
wsjf: 3.0
bcps: 10
status: proposed
source: |
  Closes remaining OKF surface area named in specs/IMPACT-e38-okf-adoption.md
  but not yet owned by any epic. OKF v0.1 already has story-metrics (e40),
  spec-migration (e44), and migration-registry (e44) bundles in production.
  This epic completes the taxonomy with the four remaining OKF types plus
  a visual graph companion.
  
  UPDATE 2026-07-03: e45s06 (tier field) added per PLAN-AUDIT red-team gap
  list — TEA's tea-index.csv tiering pattern (core/extended/specialized)
  applied to OKF wiki indexes for conditional agent loading. BCP 8→10.
release: v2.8x
codename: "Docs Polish"
source: |
  Closes remaining OKF surface area named in specs/IMPACT-e38-okf-adoption.md
  but not yet owned by any epic. OKF v0.1 already has story-metrics (e40),
  spec-migration (e44), and migration-registry (e44) bundles in production.
  This epic completes the taxonomy with the four remaining OKF types plus
  a visual graph companion.

stories:
  - id: e45s01
    bcp: 2
    title: "Generate epics-wiki and adr-wiki as OKF concept bundles from sync-skills.sh"
    verify: test -d specs/epics-wiki/ && test -d specs/adr-wiki/ && bash scripts/validate-okf.sh --dir specs/epics-wiki && bash scripts/validate-okf.sh --dir specs/adr-wiki && echo OK
    description: |
      Extend sync-skills.sh (or a new render target) to emit OKF concept bundles
      for epics and ADRs. Each bundle is a standard .md file with okf_kind: concept,
      id, title, category, and references[] frontmatter. The epics-wiki/ directory
      mirrors specs/epics/ — one concept bundle per epic with its WSJF, BCP, and
      story list. The adr-wiki/ directory mirrors specs/adr/ — one concept bundle
      per ADR with its status, decision, and consequences. Both are validated by
      validate-okf.sh as concept-type bundles.

  - id: e45s02
    bcp: 2
    title: "Emit verification reports as OKF bundles from run-golden-suite.sh and audit-compliance.sh"
    verify: bash scripts/run-golden-suite.sh && test -f specs/verifications/reports/GOLDEN-$(date +%Y-%m-%d).okf.md && bash scripts/validate-okf.sh --bundle specs/verifications/reports/GOLDEN-$(date +%Y-%m-%d).okf.md && echo OK
    description: |
      Add an OKF output mode to run-golden-suite.sh and audit-compliance.sh.
      Each run produces a verification-report OKF bundle with okf_kind:
      verification-report, score, gate_status (pass/fail/concerns/waived),
      threshold, total_pass, total_fail, and generated_by frontmatter.
      The existing markdown reports (GOLDEN-YYYY-MM-DD.yaml, audit-*.md) remain
      as raw data sources; the OKF bundle is the machine-validatable wrapper.
      validate-okf.sh gates on structure: is score present? does gate_status
      match the score vs threshold?

  - id: e45s03
    bcp: 1
    title: "OKF-ify bug-registry: specs/bugs/registry.yaml emits concept bundles per bug"
    verify: bash scripts/sync-bugs-registry.sh && bash scripts/validate-okf.sh --dir specs/bugs/ && echo OK
    description: |
      Extend sync-bugs-registry.sh to emit one OKF concept bundle per bug entry.
      Each bundle carries okf_kind: concept, id: BUG-<slug>, category: bug,
      severity, status, root_cause, and fix_story frontmatter. The existing
      registry.yaml remains the authority; OKF bundles are derivatives gated
      by validate-okf.sh. This makes bug data discoverable via the same OKF
      toolchain as everything else.

  - id: e45s04
    bcp: 2
    title: "Create viz.html — interactive force-layout graph companion for visual-dashboard"
    verify: test -f specs/viz.html && grep -q 'force\|d3\|graph' specs/viz.html && echo OK
    description: |
      Build a standalone HTML page (specs/viz.html, no server needed) that
      renders the entity-relation graph from e43's build_skill_graph output
      as a browsable interactive force-directed layout. Uses D3.js (loaded
      from CDN, no build step). Nodes are skills color-coded by effort tier;
      edges show handoff_to, depends_on, and gates relationships. Renders in
      the visual-dashboard's browser pane. The graph JSON is read from
      bigpowers-mcp/graph.jsonl (e43s02 output) or a static snapshot bundled
      at generation time.

  - id: e45s05
    bcp: 1
    status: todo
    title: "Wire OKF validation into CI (sync-skills.yml) and document in OKF authority"
    verify: grep -q 'validate-okf.sh' .github/workflows/sync-skills.yml && bash scripts/sync-skills.sh && echo OK
    description: |
      Add a CI step to sync-skills.yml that runs validate-okf.sh on all
      standard OKF directories (specs/metrics/, specs/migrations/,
      specs/epics-wiki/, specs/adr-wiki/, specs/verifications/reports/,
      specs/bugs/). Update docs/references/okf.md with the CI integration
      section. This closes the loop: OKF bundles are validated on every push,
      not just when someone remembers to run the script manually.

  - id: e45s06
    bcp: 2
    status: todo
    title: "Add tier: field (core/extended/specialized) to OKF wiki indexes for conditional agent loading"
    verify: "grep -q 'tier:' specs/epics-wiki/e38-traceability-gate.okf.md 2>/dev/null && grep -q 'tier:' specs/adr-wiki/ADR-0001.okf.md 2>/dev/null && echo OK || echo 'PENDING: wiki dirs not yet generated'"
    description: |
      Add a `tier:` field (core | extended | specialized) to every OKF
      concept bundle emitted by e45s01 (epics-wiki + adr-wiki). Source
      pattern: TEA's tea-index.csv (core/extended/specialized + tags,
      conditionally loaded — TEA reports 40-50% context savings).
      
      Tier assignment rules:
      - core: fundamental concepts every agent needs (BCP, WSJF, HARD GATE,
        build-epic cycle, CONVENTIONS, ADR-0001/0002/0003)
      - extended: specific skills, individual epics, most ADRs
      - specialized: deprecated epics, flat-format legacy, spike archives
      
      The tier field enables agents to conditionally load OKF reference
      knowledge instead of all-or-nothing — this is e34's select/compress
      strategy applied to bigpowers' own documentation. Update
      docs/references/okf.md with tier field spec and docs/references/tea.md
      with tiering provenance. (specs/metrics/, specs/migrations/,
      specs/epics-wiki/, specs/adr-wiki/, specs/verifications/reports/,
      specs/bugs/). Update docs/references/okf.md with the CI integration
      section. This closes the loop: OKF bundles are validated on every push,
      not just when someone remembers to run the script manually.
