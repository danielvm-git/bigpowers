id: e61
title: "Integration: Hermes Agent — Skills + 3 Hook Systems"
status: scoped
wsjf: 5.0
bcps: 0
mode: capsule
wsjf_rationale: >
  BV 5 + TC 3 + RR 4 / Job 3 ≈ 4.0. High-star agent (219K) but niche use case
  (gateway/messaging). Plugin hooks are Python-based, different from CLI tools.
github_stars: 219481
repo: NousResearch/hermes-agent
source: >
  Research session 2026-07-23. Hermes has 3 hook systems: Gateway hooks
  (~/.hermes/hooks/ + HOOK.yaml + handler.py), Plugin hooks (ctx.register_hook()
  in Python plugins), Shell hooks (hooks: block in ~/.hermes/config.yaml).
  Skills via ~/.hermes/skills/. Plugin hooks fire in both CLI and gateway.
integration_details:
  skills_path: ~/.hermes/skills/
  config_path: ~/.hermes/config.yaml
  hooks:
    - system: Gateway
      config: ~/.hermes/hooks/ + HOOK.yaml + handler.py
      events: [session:start, session:end, agent:start, agent:step, agent:end, command:*]
    - system: Plugin
      config: ctx.register_hook() in Python plugins
      events: [pre_tool_call, post_tool_call, pre_llm_call, post_llm_call, on_session_start, on_session_end, pre_verify, subagent_start, subagent_stop]
    - system: Shell
      config: "hooks: block in ~/.hermes/config.yaml"
      events: [shell script triggers]
  hook_format: Python (async def handle)
  hook_events_count: 12+
stories: []
