id: e28
title: "Docs Website — Fourth Generated Artifact Target"
wsjf: 2.8   # (BV 7 + TC 3 + RR-OE 4) / JS 5 — see release-plan note
total_bcps: 13
status: planned
planned_at: "2026-07-02T15:40:00Z"
description: >
  Public, Google-discoverable docs site generated entirely from existing
  sources (README.md, */SKILL.md, docs/, specs/adr) — no second repo, no
  hand-maintained site content. Astro Starlight lives in website/ in this
  repo and deploys to GitHub Pages via Actions on push to main. The site is
  a fourth generated artifact target alongside .cursor/, .gemini/, .pi/:
  editing site content directly is forbidden; edit the sources and rebuild.
intake: change-request 2026-07-02 (Mode A)
stories:
  - id: e28s01
    title: "Scaffold Astro Starlight site in website/ with local dev"
    bcps: 3
    status: todo
    ac: >
      GIVEN a fresh clone with Node installed
      WHEN the developer runs `npm run site:dev`
      THEN a local Starlight site serves with the bigpowers landing page
      AND `npm run site:build` produces a static build with zero errors
      AND website/ is excluded from the npm package (.npmignore).
    verify: "cd website && npm run build"
  - id: e28s02
    title: "Source-mapping prebuild — pages generated from repo sources"
    bcps: 5
    status: todo
    ac: >
      GIVEN the existing repo sources
      WHEN the site prebuild runs
      THEN README.md becomes the landing/getting-started pages
      AND every */SKILL.md becomes one skill page, grouped by lifecycle
      phase from frontmatter (count must equal the live skill count — no
      hardcoding)
      AND docs/ guides and specs/adr/ decisions get their own sections
      AND no content file under website/ is hand-written.
    verify: "cd website && npm run prebuild && test $(ls src/content/docs/skills | wc -l) -eq $(ls -d ../*/SKILL.md | wc -l)"
  - id: e28s03
    title: "SEO + AI discoverability layer"
    bcps: 2
    status: todo
    ac: >
      GIVEN a production build
      WHEN the output is inspected
      THEN it contains sitemap.xml, canonical URLs, per-page meta/OpenGraph
      descriptions sourced from SKILL.md frontmatter, and llms.txt.
    verify: "test -f website/dist/sitemap-index.xml && test -f website/dist/llms.txt"
  - id: e28s04
    title: "GitHub Pages deploy workflow"
    bcps: 2
    status: todo
    ac: >
      GIVEN a push to main touching content paths (*/*.md, docs/, specs/adr/,
      website/)
      WHEN the pages workflow runs
      THEN the site builds and deploys to GitHub Pages via
      actions/deploy-pages (no gh-pages branch)
      AND the workflow does not slow or interfere with the sync-skills
      drift gate.
    verify: "python3 -c \"import yaml; yaml.safe_load(open('.github/workflows/docs-site.yml'))\""
  - id: e28s05
    title: "Doctrine wiring — site content is generated, never edited"
    bcps: 1
    status: todo
    ac: >
      GIVEN CLAUDE.md and CONVENTIONS.md
      WHEN an agent reads them
      THEN the Never section forbids editing generated site content directly
      AND the website is documented as the fourth generated artifact target
      AND README gains a link to the published site.
    verify: "grep -qi 'website' CLAUDE.md && grep -qi 'website' CONVENTIONS.md"
