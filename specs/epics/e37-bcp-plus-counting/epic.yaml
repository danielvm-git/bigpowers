id: e37
slug: e37-bcp-plus-counting
title: "BCP Plus Counting — Evolve from 3D to 13D story sizing"
goal: >
  Evolve bigpowers' story-complexity sizing from the original 3-dimension BCP
  (Boundaries, Interface Elements, Business Rules) to the 13-dimension BCP Plus
  methodology (10 functional + 3 NFR). Integrate the big-counter project's AI-assisted
  counter as an optional tool, with deterministic fallback tables for offline use.
  Update affected skills (plan-work, plan-release, develop-tdd, build-epic) to
  accept BCP Plus output, and add NFR-aware sizing to security-review and
  wire-observability.
wsjf: 2.1
bcps: 18
depends_on: [e40, e33]
notes: >
  BCP Plus extends the May 2026 open-source BCP (CI&T + Itaú) with 13 dimensions
  and an AI-assisted counter targeting ~10% CV. The big-counter project
  (/Users/danielvm/Developer/big-counter) already implements the Router + Sizer
  architecture, stability harness, and MCP server. This epic integrates it into
  the bigpowers toolchain: skills emit BCP Plus totals, templates support the
  13-dimension breakdown, and the NFR Gate (standard-expectation → 0 points)
  feeds into security-review and wire-observability sizing. Depends on e40
  (Metrics Integrity — honest git-derived effort pairs with honest complexity
  sizing) and e33 (Sync Pipeline Refactor — render_okf_bundle() target for
  per-story BCP Plus breakdown).

stories:
  - id: e37s01
    title: "BCP Plus counter integration — install and smoke-test big-counter as optional tool"
    bcps: 5
    tasks:
      - task: "Add big-counter install step to setup-environment skill (pip install or npm link)"
        verify: "big-counter --version exits 0 from the project venv"
      - task: "Create docs/references/bcp-plus.md reference document (done: 2026-07-03)"
        verify: "test -f docs/references/bcp-plus.md"
      - task: "Add BCP Plus dimension reference table to docs/references/bcp.md cross-link"
        verify: "grep -c 'bcp-plus.md' docs/references/bcp.md"
      - task: "Smoke-test: run big-counter against 3 golden stories, record baseline CV"
        verify: "python -m pytest tests/golden/ -k bcp_plus --co -q | grep -c 'test_'"

