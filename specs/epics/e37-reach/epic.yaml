id: e37
title: "Reach — Universal Agent Portability"
wsjf: 7.0
bcps: 45
status: done
mode: capsule
capsule_dir: epics/e37-reach
release: v2.9x
codename: "Reach"
source: |
  Epic redesign 2026-07-06 — merges former e50 (AGENTS.md spine + OSS P1) and
  e52 (Integration Registry + OSS waves) into one coherent portability arc.

  Build order: AGENTS.md spine (s01–s04) → registry core (s05–s08) → OSS waves
  (s09–s13) → optional Codex wave (s14–s16).

  Prerequisite for waves: s01 green (unified AGENTS.md template).

source_issue: https://github.com/danielvm-git/bigpowers/issues/52
wsjf_rationale: >
  BV 8 (AGENTS.md spine unblocks all AGENTS.md-native OSS tools) + TC 5 (active)
  + RR 8 (always-green Preflight across non-Claude runtimes) / Job 3 ≈ 7.0.

in_scope:
  - "AGENTS.md Context Spine + Context Derivatives (ADR-0007)"
  - "scripts/targets.yaml Integration Registry + adapter dispatch"
  - "OSS wave targets: goose, agy, zed, omp, hermes, qwen, kilocode, continue, iflow, vibe, shai"
  - "Optional Codex wave (s14–s16): seed, global install, docs"

out_of_scope:
  - "Wave B+ deferred targets: roo, kiro-cli, tabnine, devin, windsurf, copilot"
  - "Paperclip orchestration layer"
  - "Per-skill symlinks for instruction-file-only tools (Codex, Cline, Aider)"
  - "Relocating .cursor/, .gemini/, .pi/ artifact paths"
  - "Live E2E sessions in third-party agent UIs (manual UAT only)"

stories:
  - id: e37s01
    bcp: 3
    title: "seed-conventions — unified AGENTS.md template with e51 Preflight + multi-agent header"
    status: done
    risk: P1
    spec: e37s01-agents-md-unify.md
    tasks: e37s01-tasks.yaml
    verify: >
      grep -q 'Preflight' docs/templates/AGENTS.md &&
      grep -qi 'cline\|opencode\|aider' docs/templates/AGENTS.md &&
      echo OK
    ac: |
      Given a fresh project being seeded
      When seed-conventions runs
      Then AGENTS.md is emitted from docs/templates/AGENTS.md containing the e51 Preflight command row
      And CLAUDE.md is created as a symlink to AGENTS.md (not a copy)
      And opencode.json instructions: ["AGENTS.md"] is present
      And the multi-agent preamble names active OSS tools without Codex-only title
      And opting out leaves standard seed output unchanged

  - id: e37s02
    bcp: 2
    title: "verify-install.sh + docs — Cline native AGENTS.md verification"
    status: done
    risk: P2
    spec: e37s02-cline-verify.md
    tasks: e37s02-tasks.yaml
    verify: >
      grep -qi 'cline' scripts/verify-install.sh &&
      grep -qi 'cline' skills/using-bigpowers/SKILL.md &&
      echo OK
    ac: |
      Given a bigpowers-seeded project with AGENTS.md at root
      When a Cline user follows the using-bigpowers Cline section
      Then verify-install.sh asserts AGENTS.md exists and is readable by Cline
      And using-bigpowers documents Cline as native AGENTS.md support (no adapter required)

  - id: e37s03
    bcp: 1
    title: "seed-conventions — .aider.conf.yml read:AGENTS.md bridge for Aider users"
    status: done
    risk: P3
    spec: e37s03-aider-bridge.md
    tasks: e37s03-tasks.yaml
    verify: >
      grep -qi 'aider' skills/seed-conventions/SKILL.md &&
      grep -qi 'Aider-AI' skills/using-bigpowers/SKILL.md &&
      echo OK
    ac: |
      Given a project being seeded with Aider wiring opted in
      When seed-conventions runs
      Then .aider.conf.yml is created with read: AGENTS.md entry
      And using-bigpowers Aider section references Aider-AI/aider (not paul-gauthier/aider)

  - id: e37s04
    bcp: 2
    title: "verify-install.sh — AGENTS.md spine assertions (OSS P1 + optional Codex)"
    status: done
    risk: P2
    spec: e37s04-verify-install-spine.md
    tasks: e37s04-tasks.yaml
    verify: bash scripts/verify-install.sh && echo OK
    ac: |
      Given verify-install.sh after e37 spine stories
      When run on a clean scratch environment
      Then it asserts AGENTS.md template shape and Preflight row
      And it asserts Cline/Aider wiring when opted in
      And optional Codex assertions run only when Codex wave stories are present

  - id: e37s05
    bcp: 5
    title: "scripts/targets.yaml — declarative integration registry for all targets"
    status: done
    risk: P1
    spec: e37s05-targets-registry.md
    tasks: e37s05-tasks.yaml
    verify: >
      bash scripts/validate-targets-yaml.sh &&
      bash scripts/test-adapters.sh &&
      echo OK
    ac: |
      Given the Reach domain model in specs/tech-architecture/tech-stack.md
      When e37s05 is complete
      Then scripts/targets.yaml exists with >= 5 core targets and documented schema
      And context.mode supports symlink with copy fallback for Windows
      And scripts/test-adapters.sh smoke-tests all default_on adapters
      And wave stories s09+ require test-adapters.sh PASS for each new adapter id

  - id: e37s06
    bcp: 3
    title: "scripts/generate-context-bundle.sh — AGENTS.md single source + all derivatives"
    status: done
    risk: P1
    spec: e37s06-context-bundle.md
    tasks: e37s06-tasks.yaml
    verify: >
      test -f scripts/generate-context-bundle.sh &&
      bash scripts/generate-context-bundle.sh --dry-run 2>&1 | grep -qi 'AGENTS.md' &&
      echo OK

  - id: e37s07
    bcp: 5
    title: "sync-skills.sh — adapter dispatch from targets.yaml"
    status: done
    risk: P0
    spec: e37s07-adapter-dispatch.md
    tasks: e37s07-tasks.yaml
    verify: >
      bash scripts/sync-skills.sh &&
      bash scripts/run-verification-gates.sh &&
      echo OK

  - id: e37s08
    bcp: 3
    title: "verify-install.sh — per-target contract matrix from targets.yaml"
    status: done
    risk: P1
    spec: e37s08-verify-matrix.md
    tasks: e37s08-tasks.yaml
    verify: >
      bash scripts/verify-install.sh --matrix 2>&1 | grep -q 'PASS' &&
      echo OK

  - id: e37s09
    bcp: 3
    title: "targets.yaml — Wave A: Goose (OSS) + Antigravity agy (proprietary beta)"
    status: done
    risk: P2
    spec: e37s09-wave-a-targets.md
    tasks: e37s09-tasks.yaml
    verify: >
      grep -q 'goose' scripts/targets.yaml &&
      bash scripts/verify-install.sh --matrix 2>&1 | grep -q 'goose.*PASS' &&
      echo OK

  - id: e37s10
    bcp: 4
    title: "targets.yaml — Wave B: zed, omp, hermes (skills-dir adapters)"
    status: done
    risk: P2
    spec: e37s10-wave-b-skills-dir.md
    tasks: e37s10-tasks.yaml
    verify: >
      grep -q 'zed' scripts/targets.yaml &&
      grep -q 'omp' scripts/targets.yaml &&
      grep -q 'hermes' scripts/targets.yaml &&
      echo OK

  - id: e37s11
    bcp: 3
    title: "targets.yaml — Wave C: qwen, kilocode (markdown commands + rules)"
    status: done
    risk: P2
    spec: e37s11-wave-c-markdown-rules.md
    tasks: e37s11-tasks.yaml
    verify: >
      grep -q 'qwen' scripts/targets.yaml &&
      grep -q 'kilocode' scripts/targets.yaml &&
      echo OK

  - id: e37s12
    bcp: 2
    title: "targets.yaml — Wave D: continue (rules adapter; re-opened active OSS)"
    status: done
    risk: P2
    spec: e37s12-wave-d-continue.md
    tasks: e37s12-tasks.yaml
    verify: >
      grep -q 'continue' scripts/targets.yaml &&
      bash scripts/verify-install.sh --matrix 2>&1 | grep -q 'continue' &&
      echo OK

  - id: e37s13
    bcp: 2
    title: "targets.yaml — Wave E: iflow, vibe, shai (markdown commands; optional)"
    status: done
    optional: true
    risk: P3
    spec: e37s13-wave-e-low-priority.md
    tasks: e37s13-tasks.yaml
    verify: >
      grep -q 'iflow' scripts/targets.yaml &&
      grep -q 'vibe' scripts/targets.yaml &&
      grep -q 'shai' scripts/targets.yaml &&
      echo OK

  - id: e37s14
    bcp: 3
    title: "seed-conventions — optional Codex wiring step (AGENTS.md + .codex/config.toml)"
    status: done
    optional: true
    wave: codex-optional
    risk: P2
    spec: e37s14-seed-codex-wiring.md
    tasks: e37s14-tasks.yaml
    verify: grep -qi 'codex' skills/seed-conventions/SKILL.md && grep -qi 'config.toml' skills/seed-conventions/REFERENCE.md && echo OK

  - id: e37s15
    bcp: 2
    title: "install.sh — global ~/.codex/ AGENTS.md starter symlink"
    status: done
    optional: true
    wave: codex-optional
    risk: P2
    spec: e37s15-install-codex-global.md
    tasks: e37s15-tasks.yaml
    verify: bash scripts/install.sh --dry-run 2>&1 | grep -qi 'codex' && echo OK

  - id: e37s16
    bcp: 2
    title: "using-bigpowers — Codex CLI onboarding section"
    status: done
    optional: true
    wave: codex-optional
    risk: P3
    spec: e37s16-codex-onboarding-docs.md
    tasks: e37s16-tasks.yaml
    verify: grep -qi 'codex' skills/using-bigpowers/SKILL.md && grep -q '\.codex' skills/using-bigpowers/SKILL.md && echo OK

build_order:
  - e37s01
  - e37s02
  - e37s03
  - e37s04
