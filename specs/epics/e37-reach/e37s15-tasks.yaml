      Add uninstall_codex() using unlink_if_managed for ~/.codex/AGENTS.md only;
      wire install_codex after install_pi and uninstall_codex in uninstall dispatch.
    verify: >-
      grep -q 'uninstall_codex()' scripts/install.sh &&
      grep -q 'install_codex' scripts/install.sh && echo OK
    risk: P2
    security: none
    status: todo

  - id: 4
    description: >-
      Confirm --dry-run prints Codex section without requiring Codex binary installed.
    verify: >-
      bash scripts/install.sh --dry-run 2>&1 | grep -qi 'codex' && echo OK
    risk: P2
    security: none
    status: todo

