wsjf_rationale: BV 8 + TC 5 + RR 8 / Job 5 ≈ 4.2
source: >-
  The playbook's rule is that skills advise and hooks enforce. bigpowers enforces git safety and token
  budget by hook, and generated-path drift only later in CI. Hooks are tools, so per B3 they go in the
  kernel (hooks/, scripts/), never in a new skill during the catalog freeze. Every hook keeps the existing
  multi-harness deny shape (claude, cursor, gemini modes).
playbook_plays:
- P6 build hooks
- P8 feedback loop
- P11 approval gates
