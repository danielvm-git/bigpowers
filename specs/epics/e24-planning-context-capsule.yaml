        verify: "grep -c 'planning-context\\|planning.context' elaborate-spec/SKILL.md | awk '{if($1>=1) print \"OK\"; else print \"FAIL\"}'"
      - desc: "Document conflict handling (file already exists) in elaborate-spec/SKILL.md"
        verify: "grep -q 'already exists\\|overwrite\\|Update existing' elaborate-spec/SKILL.md && echo OK || echo FAIL"
  - id: e24s02
    title: "scope-work and slice-tasks read planning-context.yaml"
    bcps: 1
    status: done
    tasks:
      - desc: "Update scope-work/SKILL.md to read planning-context.yaml before scoping questions"
        verify: "grep -q 'planning-context' scope-work/SKILL.md && echo OK || echo FAIL"
      - desc: "Update slice-tasks/SKILL.md to read planning-context.yaml before task decomposition"
        verify: "grep -q 'planning-context' slice-tasks/SKILL.md && echo OK || echo FAIL"
  - id: e24s03
    title: "run-planning tracks context lifecycle in planning-status.yaml"
