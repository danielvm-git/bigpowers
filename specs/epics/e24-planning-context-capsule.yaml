  - "scope-work and slice-tasks read planning-context.yaml instead of re-interviewing"
  - "run-planning tracks context lifecycle in planning-status.yaml"
rationale: "BV=6 (reduces re-interviewing across planning skills), TC=5 (planning UX), RR=5 (context persistence between skills), JS=3 (3 BCPs)"
stories:
