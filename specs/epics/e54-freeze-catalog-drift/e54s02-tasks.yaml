tasks:
  - id: 1
    description: "Write scripts/check-catalog-drift.sh (source scripts/lib/skill-common.sh + python-env.sh) — diff the live skills/*/SKILL.md enumeration against the newest specs/tech-architecture/CATALOG-BASELINE-*.yaml, classifying each finding as addition / removal / structural-change (name/phase/effort/model). Print each as a 'WARNING:' line. ALWAYS exit 0 — this is a Confirm-gate (user-reviewed), never a Risk/Quality gate."
