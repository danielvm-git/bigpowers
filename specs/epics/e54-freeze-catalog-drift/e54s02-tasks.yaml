    risk: P1
    status: failing   # flip to passing only after verify exits 0 (e45s06)
    allure:
      severity: high
      categories:
        - "Migration"
        - "Catalog Freeze"
        - "unit"
  - id: 2
    description: "Handle the no-baseline case per spec §6c — with no CATALOG-BASELINE-*.yaml present, print 'no baseline found, skipping drift check' and exit 0, so the check degrades gracefully instead of erroring or blocking unrelated work."
    verify: "root=$(pwd); d=$(mktemp -d); (cd \"$d\" && bash \"$root/scripts/check-catalog-drift.sh\" 2>&1 | grep -qi 'no baseline'); rc=$?; rm -rf \"$d\"; test $rc -eq 0 && echo OK"
    risk: P1
    status: failing
    allure:
      severity: high
      categories:
        - "Catalog Freeze"
        - "unit"
  - id: 3
    description: "Recognize the exception marker documented in e54s03 (a freeze-exception comment in the affected SKILL.md) and suppress the matching warning, so legitimately-unrelated work isn't nagged every run."
    verify: "grep -qi 'freeze-exception\\|exception' scripts/check-catalog-drift.sh && echo OK"
    risk: P1
    status: failing
    allure:
      severity: high
      categories:
        - "Catalog Freeze"
        - "unit"
  - id: 4
    description: "Wire the check into the CLAUDE.md Preflight chain as a trailing advisory step. Because the script always exits 0, it is visible on every Preflight run WITHOUT gating (it can never break the && chain). Do NOT add it to golden-suite-gates.sh's GOLDEN_GATES array — a gate that runs and exits non-zero counts as FAIL there, which would violate the never-gating contract."
    verify: "grep -q 'check-catalog-drift' CLAUDE.md && echo OK"
    risk: P1
    status: failing
    allure:
      severity: high
      categories:
        - "Catalog Freeze"
        - "integration"
