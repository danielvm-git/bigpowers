  - id: e38
    title: "Spec-to-Code Traceability Gate"
    wsjf: 3.50
    bcps: 13
    capsule_dir: epics/e38-traceability-gate
    note: >
      The "missing link" — deterministic spec-to-code traceability spanning
      three tiers: matrix builder (scripts/trace-stories.sh), blind-spot
      heuristic detector, and quality gate decision. TEA-inspired oracle
      confidence downgrade (tagged→high, heuristic→medium, inferred→low).
      Machine-readable JSON for CI/CD. Source: market survey of speckit-utils,
      V-Model trace, BMAD TEA bmad-testarch-trace (2026-07-02).
  - id: e39
    title: "Semantic Context Bridge"
    wsjf: 3.60
    bcps: 20
    capsule_dir: epics/e39-knowledge-graph
    note: >
      Closes remaining Layer 3 (Technical Context) and Layer 5 (Product Surface)
      gaps after e38 traceability gate. Three pillars: skill reference graph
      (parse 72 SKILL.md → directed dependency graph), agent coordination
      lockfile (prevent multi-agent collision), spec drift detection (suspect
      links when requirements change). OKF Phases 2-4: skills-wiki, conventions-
      wiki, agent-guide from sync-skills.sh + new maintain-wiki skill for
      agent-maintained language-agnostic code understanding + validate-okf.sh
      CI conformance gate. Source: Karpathy LLM Wiki, OKF v0.1, Google
      Knowledge Catalog, IMPACT-e38-okf-adoption.md, session 2026-07-02/03.
  - id: e43
    title: "MCP Semantic Context Server"
    wsjf: 4.00
    bcps: 13
    capsule_dir: epics/e43-mcp-context-server
    note: >
      Build bigpowers-mcp — a project-specific TypeScript MCP server that
      parses all 72 SKILL.md files via remark/unified into an entity-relation
      knowledge graph. Seven tools: index_skills, read_skill, build_skill_graph,
      search_skills, get_dependencies, get_git_context, validate_skill. Fills
      the Layer 3 (Technical Context) gap without needing ctxo or Markdown
      language plugins. Agents query the graph instead of reading individual
      files. Source: MCP servers research (7 reference servers analyzed),
      tree-sitter/remark survey (2026-07-03).
  - id: e40
    title: "Metrics Integrity — Honest, Additive, Benchmarkable"
    wsjf: 3.2
    bcps: 18
    capsule_dir: epics/e40-metrics-integrity
    supersedes: e35
    note: >
      Fixes a self-replicating defect: cycle-times.yaml is agent-self-reported
      wall-clock, hand-computed and ungated (outliers to 120 BCP/hr, templated
      rows, impossible identical timestamps); because bigpowers built itself,
      every downstream project inherits it. Replaces hand-arithmetic with a
      git-derived script (scripts/record-cycle-time.sh, drafted+verified this
      session) emitting two SEPARATED per-story fields — effort (idle-stripped,
      ADDITIVE via a global commit partition, Σ=project total) and lead_time
      (calendar latency, median-aggregated, never summed). Telemetry-first where
      the harness exposes usage (pi/Claude Code: tokens/cost/tier, naturally
      additive); git-effort as the portable fallback. Per-story OKF metrics
      bundle (specs/templates/story-metrics.okf.md) with aggregation tags; keeps
      the DORA four keys (market standard) but computes them from git/deploy
      events; validate-okf + provenance gate (gate on the pipeline, not the
      value). Absorbs & corrects e35 (whose "extend cycle-times.yaml" premise
      rested on the unreliable metric). Source: specs/RESEARCH-cycle-time-
      metrics.md, specs/CHANGE-REQUEST-e40-metrics-integrity.md, 2× red-team
      passes, session 2026-07-03.
  - id: e41
