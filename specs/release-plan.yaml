    '
  source: 'bigspec constitution.md — "this file is the only place principles are stated... if a rule appears
    in two files, this one wins and the other is a bug." architecture.md §1 verdicts bigpowers'' ~27 reference
    docs DROP in favor of one constitution.md. Third phase of the sequence.

    '
