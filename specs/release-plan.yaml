    '
- id: e56
  title: Reclassify Catalog — Purify Skill to Mean Only Procedure
  wsjf: 3.8
  bcps: 0
  capsule_dir: epics/e56-reclassify-catalog
  mode: capsule
  status: scoped
  wsjf_rationale: 'BV 8 (the headline transformation) + TC 5 + RR 6 / Job 5 ≈ 3.8. Highest value in the
    sequence but the largest job size — reclassifying and safely renaming/merging dozens of skills is
    real work, not a quick pass. Provisional — zero real stories sliced yet, so bcps is 0 (epic.yaml carries
    a bcps_projected estimate of 13).

    '
  source: 'bigspec architecture.md §1 — "a skill is only a procedure — rules move to the constitution,
    tools move to the kernel... target ≈28 procedures," down from 80. Uses e53s02''s tombstone-alias mechanism
    for every rename/merge. Fourth phase of the sequence.

    '
- id: e59
  title: Absorb Fresh References — Stay in Sync with bigspec's Ongoing Evolution
  wsjf: 3.7
  bcps: 0
  capsule_dir: epics/e59-absorb-fresh-references
  mode: capsule
  status: scoped
  wsjf_rationale: 'BV 4 + TC 3 + RR 4 / Job 3 ≈ 3.7. Lowest in the sequence — an ongoing maintenance capability,
    not a one-time blocking transformation. Provisional — zero real stories sliced yet, so bcps is 0 (epic.yaml
    carries a bcps_projected estimate of 6). Intent user-confirmed 2026-07-22 (stay synced with bigspec)
    — was held at low confidence until then since its content was inferred, not derived from existing
    bigpowers text the way e54-e58 are.

    '
  source: 'state.yaml''s 6-phase migration list names this phase but does not define its content. bigspec
    is a living, separately-evolving repo (architecture.md §8''s own M0-M5 sequence) — this epic is inferred
    as the ongoing mechanism that keeps bigpowers from drifting away from that target again after e54-e58
    close it. Sixth and final named phase of the sequence.

    '
