release:
  # NOTE: version is set by semantic-release at merge time from Conventional Commits.
  # Do NOT track it manually here — this field mirrors the real tag for reference only.
  # Real source of truth: `gh release view` / git tags. Last synced: v2.28.0 (2026-06-22).
  version: "2.29.0"   # next expected minor — mirror, not the authority
  codename: "Methodology"
  status: released
  semantic_release: true
  bump_hint: minor
release_trains:
  # Proposed public-launch sequencing for the current backlog (e32-e40),
  # grouped by value + dependency rather than raw WSJF order. Resolves the
  # e32-vs-e34 "what's next" decision open in specs/state.yaml handoff.
  # Written 2026-07-03 in response to: "plan a meaningful flow of launches
  # for the public." Epic-level detail unchanged below — this only sequences.
  - train: "v2.5x — Trust & Signal"
    epics: [e40, e34]
    total_bcps: 28
    rationale: >
      e40 is urgent, not optional: release-branch is writing corrupted
      cycle-time rows on every story that lands today, so every day of
      delay adds more rows for e40s07 to quarantine later. e34 is a cheap,
      dependency-free doc/frontmatter win that keeps cadence alongside it.
      Neither is public-facing — this train is pure internal debt-paydown.
  - train: "v2.6x — Traceability Gate"
    epics: [e38, e33]
    total_bcps: 26
    rationale: >
      e38 is the single highest-WSJF item in the backlog (3.50) with no
      blockers. e33 is pulled forward out of its own WSJF rank (2.0)
      because its render-target refactor is an explicit architectural
      prerequisite for e39's OKF Phase 2 (render_okf_bundle()) — landing
      it here avoids e39 stalling mid-epic on a missing dependency.
  - train: "v2.7x/v3.0 — Semantic Bridge (headline release)"
    epics: [e39, e28, e41, e37]
    total_bcps: 50
    rationale: >
      e39 builds the skill graph + OKF wikis but has no audience without
      somewhere to render them. e28 (Docs Website) is the ONLY epic in the
      entire backlog that SCOPE_LATEST.yaml itself classifies as
      user-facing rather than internal-tooling debt — pulling it out of
      its stale "pre-deepening" slot and pairing it with e39 turns two
      internal exercises into one public artifact: a live site publishing
      the generated skills-wiki/conventions-wiki. e37s02-s04 (golden suite
      maturation) closes the train as the "does the whole pipeline still
      work" capstone. Candidate for a v3.0 launch note — first release in
      this backlog with a deliverable an external user can open in a browser.
      e41 (Public Receipts, added 2026-07-03) is the launch centerpiece:
      renders compliance/golden/metrics/traceability evidence as a public
      page — highest WSJF in the backlog (3.75) but hard-depends on e28+e40,
      pinning it here.
  - train: "v2.8x — Docs Polish"
    epics: [e32, e36, e42]
    total_bcps: 40
    rationale: >
      Both are content-quality and non-blocking — safe to land whenever
      cadence allows. Sequenced last deliberately: land AFTER the v2.7x
      docs site goes live so the newly-public site doesn't launch showing
      stale or duplicated reference docs. e42 (Showcase Repo, added
      2026-07-03) joins this train so its spec trail demonstrates the
      post-e40 methodology, not the deprecated hand-arithmetic pipeline.
  drift_note: >
    e26 (Security-Review Lifecycle) is still marked "ACTIVE — next release
    (v2.30.0)" in the epics list below, but execution-status.yaml shows all
    7 of its stories done. That's stale status, not a forward-planning item
    — needs `bash scripts/sync-status-from-epics.sh`, not a release train.
epics:
  # ── BACKLOG — queued (pre-deepening) ─────────────────────────────────
  - id: e29
    title: "Repository Layout — Skill Sources Under skills/"
    wsjf: 3.3
    bcps: 7
    capsule_dir: epics/e29-skills-directory
    note: >
      Move all skill dirs from repo root into skills/ so the GitHub landing
      page shows the README (~96 root entries → ~20). Location-agnostic
      script discovery first, then atomic move + regeneration (npm
      postinstall coupling forbids a split release). WSJF (BV 5 + TC 3 +
      RR-OE 2) / JS 3 = 3.3 — outranks e28, which must build its site
      generator against the new skills/ layout, not */SKILL.md.
  - id: e28
    title: "Docs Website — Fourth Generated Artifact Target"
    wsjf: 2.8
    bcps: 13
    capsule_dir: epics/e28-docs-website
    note: >
      Astro Starlight site in website/ (same repo), pages generated at build
      time from README.md, */SKILL.md, docs/, and specs/adr; deployed to
      GitHub Pages via Actions. Zero hand-maintained site content — the site
      is a fourth generated artifact target alongside .cursor/.gemini/.pi.
      WSJF (BV 7 + TC 3 + RR-OE 4) / JS 5 = 2.8 — outranks e27 (2.0), does
      not disrupt active e26.
      OKF alignment: OKF bundles are Astro/MkDocs-ready markdown + frontmatter.
      The docs website could render specs/skills-wiki/ and specs/codebase-wiki/
      as browsable pages. See specs/IMPACT-e38-okf-adoption.md.
  - id: e27
    title: "Specs Output Naming Convention — _LATEST.md suffix"
    wsjf: 2.0
    bcps: 7
    capsule_dir: epics/e27-specs-naming-convention
    note: >
      Rename all fixed-name generated outputs in specs/ root to use _LATEST.md
      suffix (7 skills + build-skill-index.sh). Does not touch date-stamped or
      feature-stamped files.

