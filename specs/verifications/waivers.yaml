# waivers.yaml — Intentional compliance step exemptions
#
# Each entry documents a step that is KNOWN to FAIL and why.
# Waived steps are excluded from the audit denominator — the score
# reflects only unwaived checks. Expired waivers re-enter the
# denominator and FAIL the gate.
#
# Schema:
#   step_sanitized:  sanitized step slug (matches step script filename)
#   reason:          why this step is intentionally waived
#   review_date:     ISO 8601 — waiver MUST be re-evaluated by this date
#   reviewer:        who approved the waiver
#   feature:         parent feature file (for traceability)
waivers:
  - step_sanitized: then-public-symbols-should-be-unique-enough-to-be-searched-with-grep-5-results
    reason: >
      Duplicate function-name detection heuristic produces false positives
      across scripts/ and specs/verifications/steps/. Legacy skill helper
      patterns (show_help, main, etc.) are shared intentionally and do not
      indicate ambiguous naming. Re-evaluate after e33 (Sync Pipeline Refactor)
      and e36 (Documentation Deduplication) land, which will consolidate
      script structure and reduce false matches.
    review_date: "2026-10-01"
    reviewer: bigpowers-maintainer
    feature: conventions.feature

  - step_sanitized: and-files-should-be-small-enough-to-avoid-context-window-truncation-300-lines
    reason: >
      The 300-line step now scans Python too (as of 2026-07-04). Over-cap
      files: scripts/lib/trace-matrix.py (523) and scripts/lib/trace-stories.py
      (301) — the traceability engine, tightly-coupled phases. Both are
      documented in CONVENTIONS.md's "File-Size Exceptions" table with a
      split-candidate note (BUG-2026-07-04-filesize-gate-python-blindspot).
      NOTE: trace-stories.sh (formerly 613 lines) was refactored to 69 lines
      and is no longer over the cap — this waiver no longer covers it.
      Re-evaluate alongside the CONVENTIONS.md table.
    review_date: "2026-10-01"
    reviewer: bigpowers-maintainer
    feature: conventions.feature

  - step_sanitized: and-files-should-remain-under-500-lines-newspaper-metaphor
    reason: >
      The 500-line step now scans Python too (as of 2026-07-04). Sole over-cap
      file: scripts/lib/trace-matrix.py (523) — documented in CONVENTIONS.md's
      "File-Size Exceptions" table (BUG-2026-07-04-filesize-gate-python-blindspot),
      split candidate for a future plan-refactor. NOTE: trace-stories.sh
      (formerly 613) is now 69 lines and audit-compliance.sh (300) is under
      the 500 cap — neither is covered by this waiver anymore.
    review_date: "2026-10-01"
    reviewer: bigpowers-maintainer
    feature: akita.feature

  - step_sanitized: and-complex-boolean-logic-should-be-encapsulated-in-named-functions-g28
    reason: >
      G28 (encapsulate complex booleans in named functions) has false
      positives in scripts/ where shell conditionals use multi-clause
      patterns that are idiomatic in bash (e.g., [[ -n "$X" && -f "$Y" ]]).
      Shell does not have function-call overhead isolation like compiled
      languages — extracting every multi-clause conditional would harm
      readability. Re-evaluate when a shell-specific G28 rubric is
      defined.
    review_date: "2026-10-01"
    reviewer: bigpowers-maintainer
    feature: akita.feature
