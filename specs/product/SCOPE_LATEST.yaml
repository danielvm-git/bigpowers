version: "1"
core_value: "Maintain senior-grade quality (audit score) while scaling agentic autonomy."

summary: |
  Agent skills for solo developers (Claude Code, Cursor, Gemini CLI).
  Prescriptive lifecycle, architectural depth, surgical changes, empirical verification.

in_scope:
  - id: fr-01
    title: Skill lifecycle with SKILL.md sources
  - id: fr-02
    title: Gherkin audit harness via audit-compliance.sh
  - id: fr-03
    title: Orchestration meta-skills
  - id: fr-04
    title: Context isolation per skill spawn
  - id: fr-05
    title: Supply-chain security in plan-work and audit-code
  - id: fr-06
    title: Verify phase (verify-work, run-evals)
  - id: fr-07
    title: YAML specs cockpit (state, release-plan, epics, execution-status)
  - id: fr-08
    title: Wave-based execution where independent
  - id: fr-09
    title: Local-first specs in specs/
  - id: fr-10
    title: Discoverable repository layout — skill sources grouped under skills/, README visible on GitHub landing page
    epic: e29

  # ── v2.45.0 "Deepening" track — internal-tooling debt ─────────────────
  # These epics improve the skill system's architecture and quality infrastructure.
  # They are not user-facing features; scope is internal-tooling debt reduction.
  # Source docs: DEEPEN-ARCHITECTURE-REVIEW.md, MISSING-REFERENCES-AND-DELIVERY-PLAN.md,
  # QUALITY-GUARANTEE-STRATEGY.md. Build order in specs/release-plan.yaml.
  - id: fr-11
    title: Quality guarantee infrastructure — golden story suite, compliance gate, token budget (e31)
    epic: e31
  - id: fr-12
    title: Architecture quick fixes — fix concrete bugs from architecture review (e30)
    epic: e30
  - id: fr-13
    title: Historical reference docs — 9 missing provenance pointers (e32)
    epic: e32
  - id: fr-14
    title: Sync pipeline refactor — parse→IR→render (e33)
    epic: e33
  - id: fr-15
    title: Context engineering layer — named strategies + effort frontmatter (e34)
    epic: e34
  - id: fr-16
    title: DORA metrics extension — beyond BCP/hr to four DORA keys (e35)
    epic: e35
  - id: fr-17
    title: Documentation deduplication — provenance pointers, not restatements (e36)
    epic: e36

out_of_scope:
  - Domain-specific scaffold skills
  - SaaS tracker integrations (Jira, Linear)
  - Marketplace or plugin store model
  - Renaming any skill during the layout move (deferred — naming is governed by ADR-0001, orthogonal to location)
  - Relocating generated artifact targets .cursor/, .gemini/, .pi/ (consumer tools read these paths)
  - Relocating tool-read root files CLAUDE.md, GEMINI.md, opencode.json, index.js (breaks Claude Code, Gemini CLI, opencode, npm)

constraints:
  - Max 300 lines per file
  - Grep uniqueness under 5 hits per symbol
  - Single canonical location per fact
  - npm postinstall runs sync-skills.sh + install.sh — skill relocation and script updates must ship atomically in one release (fr-10)

success_criteria:
  - Compliance suite at or above 94%
  - Skills synced via sync-skills.sh
  - YAML layout validates via validate-specs-yaml.sh
  - Repo root has ~20 entries so README renders above the fold on GitHub (fr-10)
  - Skill count and all consumer artifacts unchanged after the skills/ move (fr-10)
  - Golden story suite baseline established (fr-11, e31)
  - Tautological verify commands eliminated from all skills (fr-12, e30)

references:
  plans: specs/tech-architecture/TECH_STACK_LATEST.md
  adr: specs/adr/
