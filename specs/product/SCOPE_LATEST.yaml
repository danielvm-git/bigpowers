out_of_scope:
  - Continue (continuedev/continue) — repo self-declared read-only and unmaintained as of 2.0.0; users should migrate to Cline or OpenCode
  - Per-skill symlinks for instruction-file-only tools (Codex, Cline, Aider) — these tools use AGENTS.md, not a skill catalog
  - "'@bigpowers/mcp-server' npm package — not scoped until MCP server is built (separate initiative)"
  - Marketplace or plugin store model — deferred; dual-channel publishing depends on MCP server
  - Domain-specific scaffold skills
  - SaaS tracker integrations (Jira, Linear)
  - Renaming any skill during layout moves (governed by ADR-0001, orthogonal to portability)
  - Relocating generated artifact targets .cursor/, .gemini/, .pi/ (consumer tools read these paths)
  - Relocating tool-read root files CLAUDE.md, GEMINI.md, opencode.json, index.js (breaks consumers)
  - Hermes-agent, Paperclip — orchestration layers, not seed targets; different problem space
  - Wave B+ targets (roo, kiro-cli, tabnine, qwen, devin, windsurf, copilot) — deferred until registry is stable

constraints:
  - Max 300 lines per file
  - Grep uniqueness under 5 hits per symbol
  - Single canonical location per fact
  - npm postinstall runs sync-skills.sh + install.sh — skill relocation and script updates must ship atomically in one release (fr-10)

success_criteria:
  - Compliance suite at or above 94%
  - Skills synced via sync-skills.sh
  - YAML layout validates via validate-specs-yaml.sh
  - Repo root has ~20 entries so README renders above the fold on GitHub (fr-10)
  - Skill count and all consumer artifacts unchanged after the skills/ move (fr-10)
  - Golden story suite baseline established (fr-11, e31)
  - Tautological verify commands eliminated from all skills (fr-12, e30)

