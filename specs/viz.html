const ENTITIES = [{"type": "entity", "name": "align-grid", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Build editorial/magazine/report webpages on a GENUINE M\u00fcller-Brockmann modular grid (International Typographic Style) \u2014 not a decorative one. Encodes the discipline (columns + modules + baseline, grotesque type, flush-left, restrained black/white/red palette) AND the hard-won front-end engineering to make the grid real, visible, and verified: one CSS-variable source of truth, an interactive grid-toggle overlay that lives in the SAME content box as the content, subgrid \"bands\" so every element snaps to a column line, an 8px baseline lock, and runtime OPTICAL ALIGNMENT that puts display type's ink (not its box) on the line. Ships with a scaffold generator and a Puppeteer verification harness that proves 0px adherence."]}, {"type": "entity", "name": "assess-impact", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Analyze the blast radius of a proposed change before any code is written. Maps dependents, affected stories, and test coverage. Produces specs/IMPACT_LATEST.md. Use before plan-work on any non-trivial change, when touching a shared module, or when the user asks \"what does this break?\"."]}, {"type": "entity", "name": "audit-code", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Self-review checklist for the coding agent to run before dispatching a reviewer. Checks CONVENTIONS.md compliance, Boy Scout Rule, test coverage, types, and SOLID. Produces a pass/fail checklist. Use before request-review, before committing, or when user asks for a code quality check."]}, {"type": "entity", "name": "audit-plan", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Evaluate an incoming project plan against bigpowers principles and conventions, surface gaps, and produce a READY/NOT READY verdict before engagement begins. Use when a new project arrives, when adapting a foreign plan, or before running seed-conventions on an unfamiliar codebase."]}, {"type": "entity", "name": "build-epic", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Eight-step epic build cycle \u2014 reads state.yaml, execution-status.yaml, and one epic capsule; updates status via bp-yaml-set or direct edit. Resume mode runs one step per invocation. Use instead of ad-hoc execute-plan for release work."]}, {"type": "entity", "name": "change-request", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Add a new requirement or reorder epics by WSJF against specs/release-plan.yaml and epic capsule directories. Modes Add and Reorder. Use when a new requirement arrives mid-release or the plan needs prioritization."]}, {"type": "entity", "name": "commit-message", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Reviews working-tree changes, then drafts a Conventional Commits title/body and states the semantic-release version bump a single such commit would imply. Also notes which defensive-code categories were touched. Use when the user wants to commit recent work, prepare a Conventional Commits message, or asks for semantic-release / semver-consistent messaging before git commit."]}, {"type": "entity", "name": "compose-workflow", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Chain multiple bigpowers skills into a custom workflow recipe saved in specs/. Use when a project repeats a non-standard skill sequence, or user wants a documented playbook beyond orchestrate-project modes."]}, {"type": "entity", "name": "craft-skill", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Create new bigpowers skills with proper structure, progressive disclosure, and bundled resources. Use when user wants to create, write, or build a new skill for the bigpowers lifecycle."]}, {"type": "entity", "name": "deepen-architecture", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Find deepening opportunities in a codebase, informed by the domain language in specs/tech-architecture/tech-stack.md and the decisions in specs/adr/. Use when the user wants to improve architecture, find refactoring opportunities, consolidate tightly-coupled modules, or make a codebase more testable and AI-navigable."]}, {"type": "entity", "name": "define-language", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Extract a DDD-style ubiquitous language glossary from the current conversation, flagging ambiguities and proposing canonical terms. Saves to specs/UBIQUITOUS_LANGUAGE_LATEST.md. Use when user wants to define domain terms, build a glossary, harden terminology, create a ubiquitous language, or mentions \"domain model\" or \"DDD\"."]}, {"type": "entity", "name": "define-success", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Convert an imperative task statement into explicit \"step \u2192 verify: <cmd>\" pairs before implementation begins. Use before plan-work when success criteria are unclear, when a task lacks verifiable checkpoints, or when user says \"how will we know this is done?\"."]}, {"type": "entity", "name": "delegate-task", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Delegate one complex task to a single subagent, review its work in two stages before merging back. Sequential \u2014 one agent at a time, with oversight. Use when a task is complex and requires careful review before the result is accepted. Distinct from dispatch-agents (no parallelism here; reviewer sees full diff before proceeding)."]}, {"type": "entity", "name": "deploy", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Build \u2192 verify artifact \u2192 deploy \u2192 wait \u2192 smoke deployment pipeline. Platform-agnostic (MCP or CLI), with configurable timeout, retry with exponential backoff, and integrated health-check. The deploy half of CI/CD: run after build to push to production."]}, {"type": "entity", "name": "design-interface", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Generate multiple radically different interface designs for a module using parallel sub-agents, then compare trade-offs. Based on \"Design It Twice\" from A Philosophy of Software Design. Use when user wants to design an API, explore interface options, compare module shapes, or mentions \"design it twice\"."]}, {"type": "entity", "name": "develop-tdd", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Test-driven development with red-green-refactor loop using vertical slices. Use for features (epic tasks) or bugs (specs/bugs/BUG-*.md)."]}, {"type": "entity", "name": "diagnose-root", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Run 4-phase root cause analysis \u2014 reproduce, isolate, hypothesize, verify. Use when a bug is confirmed but root cause is unclear, after investigate-bug, or when user mentions root cause analysis."]}, {"type": "entity", "name": "dispatch-agents", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Dispatch multiple subagents in parallel on independent tasks. No waiting between them \u2014 all run concurrently. Use when tasks are truly decoupled and speed matters. Distinct from delegate-task (concurrent here, no inter-task review gate)."]}, {"type": "entity", "name": "edit-document", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Edit and improve documents by restructuring sections, improving clarity, and tightening prose. Use when user wants to edit, revise, restructure, or improve any document \u2014 including specs/ files, articles, READMEs, or technical writing."]}, {"type": "entity", "name": "elaborate-spec", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Refine a rough idea into a clear, detailed specification through dialogue. Does not produce code. Use when user has a vague idea, wants to think through a feature before planning, or needs to turn \"I want X\" into a concrete spec."]}, {"type": "entity", "name": "enforce-first", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Apply the F.I.R.S.T test quality rubric (per CONVENTIONS.md \u00a7Tests) to a test suite or individual tests. Use when develop-tdd is writing tests, when test quality needs to be checked, or when user mentions F.I.R.S.T or \"test quality\"."]}, {"type": "entity", "name": "evolve-skill", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Benchmark-gated skill evolution \u2014 consume bigpowers-benchmark report, propose plan-work change, edit skill via craft-skill, re-run benchmark, record ADR. Use when a skill underperforms on benchmark or stocktake finds systemic gap."]}, {"type": "entity", "name": "execute-plan", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Batch-execute tasks from the active epic capsule sequentially, with a human checkpoint after each step. Use when user has an approved plan and wants step-by-step oversight."]}, {"type": "entity", "name": "extract-design", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Extract a Google DESIGN.md file from an HTML prototype (claude.ai/design or any styled page) using Puppeteer, producing machine-readable tokens and AI-generated prose. Use when the user has an HTML prototype and wants a DESIGN.md to anchor their project's visual identity, or when seed-conventions has just scaffolded a new project."]}, {"type": "entity", "name": "fix-bug", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Bug fix orchestrator \u2014 active_flow fix_bug; reads specs/bugs/BUG-*.md; chains investigate-bug, develop-tdd, validate-fix. Use when user reports a defect."]}, {"type": "entity", "name": "gate-trace", "entityType": "Skill", "observations": ["model: haiku", "effort: light", "description: Deterministic traceability quality gate \u2014 reads coverage matrix + blind-spot data, applies decision rules with oracle confidence downgrade, emits PASS/CONCERNS/FAIL/WAIVED verdict. Use before release-branch to gate merges on traceability."]}, {"type": "entity", "name": "grill-me", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Interactive assumption-surfacing Q&A that stress-tests a plan through relentless questioning until every decision is resolved. Use when user wants to challenge a plan, validate decisions from conversation/context, or mentions \"grill me\". For doc-grounded variant, use grill-with-docs."]}, {"type": "entity", "name": "grill-with-docs", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Doc-grounded variant of grill-me \u2014 stress-tests plan assumptions by fetching and citing real library or API documentation. Every challenge must cite a real URL. Use when the plan depends on a specific library or external API."]}, {"type": "entity", "name": "guard-git", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Block dangerous git commands (push, force push, reset --hard, clean, branch -D, checkout/restore .) and enforce Conventional Commits & Branch Protection before an AI agent runs them. Installs hook scripts for Claude Code, Cursor, Cursor CLI, and Gemini CLI; documents Google Antigravity Terminal deny lists. Use when the user wants git safety hooks, to block git push or destructive git in agents, or to mirror the same policy across AI coding tools."]}, {"type": "entity", "name": "hook-commits", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Set up pre-commit hooks with lint-staged (Prettier), type checking, and tests in the current repo. Use when user wants to add pre-commit hooks, set up Husky, configure lint-staged, or add commit-time formatting/typechecking/testing."]}, {"type": "entity", "name": "inspect-quality", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Interactive QA session where user reports bugs or issues conversationally, and the agent logs them to specs/bugs/registry.yaml with a structured audit schema. Explores the codebase in the background for context and domain language. Use when user wants to report bugs, do QA, or mentions \"QA session\"."]}, {"type": "entity", "name": "investigate-bug", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Investigate a bug or issue by exploring the codebase to find root cause, then write a TDD-based fix plan to specs/bugs/BUG-*.md. Use when user reports a bug, wants to investigate a problem, mentions \"triage\", or wants to plan a fix."]}, {"type": "entity", "name": "kickoff-branch", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Create a git worktree and feature branch, then verify a clean test baseline before any code is written. Use when starting a new feature or task, when user wants to work in isolation from main, or mentions \"start a branch\" or \"new worktree\"."]}, {"type": "entity", "name": "map-codebase", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Derives the tech-stack doc from scratch by scanning the codebase \u2014 analyzes stack, architecture, and gray areas (error handling, API shapes) and persists findings into specs/tech-architecture/tech-stack.md. Run fort: standard", "description: Create a detailed refactor plan with tiny commits via user interview, then save it as specs/REFACTOR_LATEST.md. Use when user wants to plan a refactor, create a refactoring RFC, or break a refactor into safe incremental steps."]}, {"type": "entity", "name": "plan-release", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: RELEASE-INDEX BUILDER \u2014 Sequence elaborated epics into specs/release-plan.yaml with WSJF ordering and BCP baselines. NOT a planning-spine substitute: it does not scope work (scope-work) or write story tasks (plan-work). Use after elaborate-spec when the user wants a versioned release index of epics."]}, {"type": "entity", "name": "plan-tests", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Design a risk-scaled test architecture for an epic before implementation begins. Produces prioritized scenarios, test level distribution, and fixture plans based on TEA and bigpowers principles."]}, {"type": "entity", "name": "plan-work", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: PLANNING SPINE STEP 3 of 3 \u2014 Plan the work: write detailed implementation tasks into the active epic capsule (specs/epics/eNN-slug/). Produces countable-story-format .md specs and runnable -tasks.yaml files. Use after slice-tasks (step 2). Not a substitute for scope-work (step 1) or slice-tasks (step 2)."]}, {"type": "entity", "name": "publish-package", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Package registry publishing for npm, crates.io, PyPI, and Homebrew. Verifies prerequisites, runs the publish command, confirms success, and surfaces actionable error hints on failure."]}, {"type": "entity", "name": "quick-fix", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Streamlined fast-path for trivial data-only fixes \u2014 no TDD, no branching ceremony. Collapses 6 skills into 2 for changes that are purely data with no logic risk. Aborts with fallback to investigate-bug if guardrails trigger."]}, {"type": "entity", "name": "release-branch", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Make the merge/PR/keep/discard decision for a feature branch, verify coverage gates, create the PR with gh, and clean up the worktree. Use when a feature is done and ready to ship, or when user says \"release\", \"merge\", or \"open a PR\"."]}, {"type": "entity", "name": "request-review", "entityType": "Skill", "observations": ["model: opus", "effort: standard", "description: Dispatch a fresh reviewer agent with a clean context to critique the code after audit-code passes. The reviewer has no shared state with the coding agent and gives a genuine second opinion. Use after audit-code passes, before committing, or when user wants an independent code review."]}, {"type": "entity", "name": "research-first", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Look-before-build \u2014 search registries, repo, existing skills, and web for prior art before implementing. Appends Prior Art to the spec. Use after survey-context and before elaborate-spec, when adding dependencies, or when the task may already be solved."]}, {"type": "entity", "name": "reset-baseline", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Restore the project to a known clean state between agent runs or experiments. Use between benchmark runs, after a failed spike, or when user wants a clean working tree."]}, {"type": "entity", "name": "respond-review", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Act on a reviewer agent's feedback systematically \u2014 categorize findings, apply fixes, verify tests still pass. Use after request-review returns a report, or when user wants to work through code review findings."]}, {"type": "entity", "name": "run-benchmark", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Run skill quality benchmarks from specs/benchmarks/ definitions \u2014 N-run with/without-skill delta grading, train/validation split, pass@k + benchmark.json reports. Use before and after evolve-skill to prove quality changes are improvements, not regressions."]}, {"type": "entity", "name": "run-evals", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Eval-Driven Development \u2014 define capability and regression evals before building; code graders use verify commands, model graders use explicit rubrics; log pass@k. Use before develop-tdd on new features, or when measuring agent capability over runs."]}, {"type": "entity", "name": "run-planning", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: DISCOVER-PHASE ADVANCER \u2014 Drive the discover-phase checklist (specs/planning-status.yaml) through survey-context \u2192 scope-work \u2192 research-first \u2192 elaborate-spec \u2192 plan-release \u2192 slice-tasks. NOT a duplicate of plan-work or the planning spine; it orchestrates the pre-coding discover phase only."]}, {"type": "entity", "name": "scope-work", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: PLANNING SPINE STEP 1 of 3 \u2014 Scope the work: define what is in and out of scope and save as specs/product/SCOPE_LATEST.yaml. Use before slice-tasks or plan-release on any new initiative. Not a substitute for slice-tasks (step 2) or plan-work (step 3)."]}, {"type": "entity", "name": "search-skills", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Find the right bigpowers skill from natural-language intent using a local lexical index over SKILL.md frontmatter. Use when unsure which skill to invoke, or at start of research-first."]}, {"type": "entity", "name": "security-review", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: AI-powered security analysis of code changes \u2014 traces data flow, detects injection, auth bypass, secrets exposure, and unsafe deserialization across files. Use when reviewing pending changes, before release-branch, during verify-work Phase 5, during build-epic Step 0 threat modeling, or when the user says \"security review\" or \"scan for vulns\".\n"]}, {"type": "entity", "name": "seed-conventions", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Generate CLAUDE.md and CONVENTIONS.md for a brand-new project through a brief interview, and create the specs/ directory with evolved bigpowers structure (product/, tech-architecture/, verifications/, epics/archive/). Entry point for greenfield projects. Use when starting a new project from scratch, when user asks to set up AI agent conventions, or when there is no CLAUDE.md yet."]}, {"type": "entity", "name": "session-state", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Track implementation decisions and progress in specs/state.yaml to prevent context rot. Use at the start of a session to load context, and whenever a significant decision is made or a milestone is reached."]}, {"type": "entity", "name": "setup-environment", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Pre-install dependencies and configure tools before development work begins. Use at session start on a fresh clone, before kickoff-branch, or when user says setup environment or install deps."]}, {"type": "entity", "name": "simulate-agents", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Run Mock User and Auditor agents against a feature in fresh contexts before human review. Use after verify-work, before request-review, when user wants pre-review simulation."]}, {"type": "entity", "name": "slice-tasks", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: PLANNING SPINE STEP 2 of 3 \u2014 Slice the work: break a scoped PRD into vertical-slice stories in specs/epics/. Use after scope-work (step 1), before plan-work (step 3). Not a substitute for scope-work or plan-work."]}, {"type": "entity", "name": "smoke-test", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Post-deploy health-check against a live URL. Validates HTTP status, response content, and critical endpoints. Runnable standalone OR as the final step of the deploy skill."]}, {"type": "entity", "name": "spike-prototype", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Throw-away prototype for unknown problem spaces. Output is learning notes in specs/archive/spikes/SPIKE-<name>.md, not production code. Use when the domain or technology is unexplored, when estimates are impossible without experimentation, or when user says \"spike\", \"prototype\", or \"proof of concept\"."]}, {"type": "entity", "name": "stocktake-skills", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Sequential subagent batch audit of the bigpowers skill catalog \u2014 Quick Scan (changed only) or Full (all skills). Use during sustain phase, before a major release, or when catalog drift is suspected."]}, {"type": "entity", "name": "survey-context", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Per-task context bootstrap \u2014 reads existing specs/ and tech-architecture docs to map the current lifecycle phase and suggest the next skill. Use at the start of any task, when returning after a break, or when unsure what to do next. For deriving a tech-stack doc from scratch, use map-codebase first."]}, {"type": "entity", "name": "terse-mode", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Fallback ultra-compressed communication mode. Cuts token usage ~75% by dropping filler, articles, and pleasantries while keeping full technical accuracy. Use ONLY when context is critically long and compressing output is necessary to continue. Not a strategy \u2014 token discipline comes from code shape (small functions, unique names, headless tests), not terser prompts. Use when user says \"caveman mode\", \"terse mode\", \"less tokens\", \"be brief\", or invokes /terse-mode."]}, {"type": "entity", "name": "trace-requirement", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Link story IDs from specs/release-plan.yaml + epic capsule directories to the implementing code and tests. Produces specs/TRACEABILITY_LATEST.md. Use when you want to verify coverage of a release plan, audit which stories are implemented, or find \"dark\" stories with no code."]}, {"type": "entity", "name": "using-bigpowers", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: One-time bootstrap that introduces the bigpowers skills system, the PMBOK lifecycle arc, and tells you which skill to call first for your situation. Use when starting with bigpowers for the first time, when user asks \"where do I start?\", or when the skills system needs to be explained."]}, {"type": "entity", "name": "validate-contracts", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Assert data shape consistency across system boundaries \u2014 live API responses against JSON Schema, key-set comparison across layers, data shape validation for migrations and exports. Catches silent data corruption before deploy."]}, {"type": "entity", "name": "validate-fix", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Prove a fix works before declaring done \u2014 re-run the failing test, run the full suite, typecheck, lint, and harden against recurrence. Use after implementing a bug fix, when user says \"is this fixed?\", or before closing an investigation."]}, {"type": "entity", "name": "verify-work", "entityType": "Skill", "observations": ["model: haiku", "effort: standard", "description: Multi-phase UAT gate \u2014 cold-start smoke, build, typecheck, lint, tests, step-by-step manual verification, gaps-closure loop. Use after execute-plan or develop-tdd, before audit-code."]}, {"type": "entity", "name": "visual-dashboard", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Start a browser-based dashboard that visualizes architecture, implementation plans, and project status. Persists artifacts in .bigpowers/dashboard/. Reads specs/state.yaml, release-plan.yaml, epics, and planning-status via HTTP API or opencode panel."]}, {"type": "entity", "name": "wire-ci", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: CI pipeline setup with pre-built templates and local validation. Generates GitHub Actions workflows, validates YAML syntax and permissions, supports dry-run via act/gh. The CI equivalent of wire-observability."]}, {"type": "entity", "name": "wire-observability", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Add structured JSON logging, observability commands, and idempotent setup scripts to a project. Use when a project needs production-readiness instrumentation, when user wants structured logging, or as a production-readiness gate at any phase of development."]}, {"type": "entity", "name": "write-document", "entityType": "Skill", "observations": ["model: sonnet", "effort: standard", "description: Write, organize, and sync high-integrity technical documents using the BMAD methodology. Ensures every document is Bold, Minimal, Actionable, and Durable. Use when creating architectural docs, technical guides, or organizing the specs/ directory."]}];
const EDGES = [{"from": "audit-code", "to": "CONVENTIONS.md \u00a7Tests;", "relationType": "enforces"}, {"from": "audit-code", "to": "CONVENTIONS.md \u00a7Tests;", "relationType": "enforces"}, {"from": "commit-message", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "commit-message", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "craft-skill", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "craft-skill", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "craft-skill", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "craft-skill", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "delegate-task", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "delegate-task", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "delegate-task", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "delegate-task", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "dispatch-agents", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "dispatch-agents", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests.", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests.", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests.", "relationType": "enforces"}, {"from": "enforce-first", "to": "CONVENTIONS.md \u00a7Tests.", "relationType": "enforces"}, {"from": "release-branch", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "release-branch", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "request-review", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "request-review", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "respond-review", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "respond-review", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "run-benchmark", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "run-benchmark", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "seed-conventions", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "seed-conventions", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "session-state", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "session-state", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "simulate-agents", "to": "CONVENTIONS.md", "relationType": "enforces"}, {"from": "simulate-agents", "to": "CONVENTIONS.md", "relationType": "enforces"}];

const effortColors = { light: '#58a6ff', standard: '#3fb950', heavy: '#d29922' };
const effortRadii = { light: 8, standard: 12, heavy: 16 };

const nodes = ENTITIES.map(e => {
  const obs = (e.observations || []).join(' ');
  const effortMatch = obs.match(/effort:\s*(\w+)/);
  const effort = effortMatch ? effortMatch[1] : 'standard';
  const descMatch = obs.match(/description:\s*(.+?)(?:\]|$)/);
  const desc = descMatch ? descMatch[1] : '';
  const modelMatch = obs.match(/model:\s*(\w+)/);
  const model = modelMatch ? modelMatch[1] : '';
  return { id: e.name, type: e.entityType, effort, model, description: desc, radius: effortRadii[effort] || 12, color: effortColors[effort] || '#8b949e' };
});

const nodeIds = new Set(nodes.map(n => n.id));
const links = EDGES.filter(e => nodeIds.has(e.from) && nodeIds.has(e.to))
  .map(e => ({ source: e.from, target: e.to, type: e.relationType }));

const width = window.innerWidth, height = window.innerHeight;
const svg = d3.select('#graph').append('svg').attr('width', width).attr('height', height);
const g = svg.append('g');
const tooltip = d3.select('#tooltip');
svg.call(d3.zoom().scaleExtent([0.2, 4]).on('zoom', (e) => g.attr('transform', e.transform)));

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(80))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => d.radius + 4));

g.append('g').selectAll('line').data(links).join('line')
  .attr('class', 'link').attr('stroke-width', 1);

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .attr('class', 'node')
  .call(d3.drag()
    .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append('circle').attr('r', d => d.radius).attr('fill', d => d.color).attr('stroke', '#30363d');
node.append('text').attr('dy', d => d.radius + 12).attr('text-anchor', 'middle').text(d => d.id);

node.on('mouseenter', (e, d) => {
  tooltip.style('opacity', 1)
    .html('<div class="name">' + d.id + '</div><div class="meta">' + d.type + ' · ' + d.effort + (d.model ? ' · model: ' + d.model : '') + '</div><div class="desc">' + d.description.slice(0, 200) + '</div>');
}).on('mousemove', (e) => {
  tooltip.style('left', (e.pageX + 14) + 'px').style('top', (e.pageY - 10) + 'px');
}).on('mouseleave', () => tooltip.style('opacity', 0));

simulation.on('tick', () => {
  svg.selectAll('.link').attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');
});
</script>
