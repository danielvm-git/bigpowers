# story: e48s08

name: Publish to Wiki
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Validate OKF
        run: |
          bash scripts/validate-okf.sh --dir specs/epics-wiki
          bash scripts/validate-okf.sh --dir specs/adr-wiki

      - name: Publish to Wiki
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
          WIKI_REPO_URL: https://github.com/${{ github.repository }}.wiki.git
        run: |
          bash kernel/src/publish-to-wiki.sh
