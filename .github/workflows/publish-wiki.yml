# story: e48s08

name: Publish to Wiki
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate OKF
        run: |
          bash scripts/validate-okf.sh --dir specs/epics-wiki
          bash scripts/validate-okf.sh --dir specs/adr-wiki

      - name: Publish to Wiki
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
        run: |
          bash kernel/src/publish-to-wiki.sh
