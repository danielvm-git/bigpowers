# story: e38s03
name: Sync Skills on Push

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
    paths:
      # skills/*/*.md covers SKILL.md AND supporting .md files — both are concatenated into artifacts
      - 'skills/*/*.md'
      - 'scripts/sync-skills.sh'
      - 'scripts/build-skill-index.sh'
      - 'scripts/trace-stories.sh'
      - 'scripts/lib/trace-stories.py'
      - 'package.json'
      - 'specs/state.yaml'
      - 'specs/release-plan.yaml'
      - 'specs/execution-status.yaml'
      - 'specs/traceability-matrix.json'
      - 'specs/epics/**'
      - 'specs/tech-architecture/**'
      - 'bigpowers-mcp/**'
      - '.github/workflows/sync-skills.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'skills/*/*.md'
      - 'scripts/sync-skills.sh'
      - 'scripts/build-skill-index.sh'
      - 'scripts/trace-stories.sh'
      - 'scripts/lib/trace-stories.py'
      - 'package.json'
      - 'specs/state.yaml'
      - 'specs/release-plan.yaml'
      - 'specs/execution-status.yaml'
      - 'specs/traceability-matrix.json'
      - 'specs/epics/**'
      - 'specs/tech-architecture/**'
      - 'bigpowers-mcp/**'
      - '.github/workflows/sync-skills.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          # Path-filtered workflows default to sparse checkout; trace gate needs full tree.
          sparse-checkout: .

      - name: Sync skills and verify artifacts committed
        run: |
          bash scripts/sync-skills.sh
          bash scripts/validate-doctrine.sh
          git diff --exit-code \
            .cursor/rules \
            .gemini/extensions/bigpowers \
            .pi \
            SKILL-INDEX.md \
            skills-lock.json \
            README.md \
            specs/SKILL-SEARCH-INDEX_LATEST.md || {
            echo "::error::Generated artifacts out of date. Run: bash scripts/sync-skills.sh && git add -A && git commit"
            git diff --stat .cursor/rules .gemini/extensions/bigpowers .pi SKILL-INDEX.md skills-lock.json README.md specs/SKILL-SEARCH-INDEX_LATEST.md
            exit 1
          }

      - name: Traceability gate (--strict)
        run: |
          if [ -f scripts/trace-stories.sh ]; then
            bash scripts/trace-stories.sh --strict --json
          else
            echo "::warning::trace-stories.sh not found — skipping traceability gate"
          fi

      - name: Upload traceability matrix
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: traceability-matrix
          path: specs/traceability-matrix.json

      - name: Validate OKF bundles (non-blocking)
        continue-on-error: true
        run: |
          if [ -f scripts/validate-okf.sh ]; then
            bash scripts/validate-okf.sh --dir specs/metrics || echo "::warning::OKF bundle validation found issues (non-blocking)"
          else
            echo "::notice::validate-okf.sh not found — skipping"
          fi
