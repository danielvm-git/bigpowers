# story: e38s03
name: Sync Skills on Push

concurrency:
  group: sync-skills-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'skills/*/*.md'
      - 'scripts/sync-skills.sh'
      - 'scripts/build-skill-index.sh'
      - 'scripts/trace-stories.sh'
      - 'scripts/lib/trace-stories.py'
      - 'package.json'
      - 'specs/state.yaml'
      - 'specs/release-plan.yaml'
      - 'specs/execution-status.yaml'
      - 'specs/traceability-matrix.json'
      - 'specs/epics/**'
      - 'specs/tech-architecture/**'
      - 'bigpowers-mcp/**'
      - '.github/workflows/sync-skills.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Stale-lock validation (e39s02)
        run: |
          if [ -f specs/agent-locks.yaml ]; then
            python3 -c "
import yaml, datetime, sys
now = datetime.datetime.now(datetime.timezone.utc)
with open('specs/agent-locks.yaml') as f:
    d = yaml.safe_load(f)
if d and 'locks' in d:
    stale = []
    for lock in d['locks']:
        locked_at = datetime.datetime.fromisoformat(lock.get('locked_at', '1970-01-01T00:00:00Z'))
        if locked_at.tzinfo is None:
            locked_at = locked_at.replace(tzinfo=datetime.timezone.utc)
        age_hours = (now - locked_at).total_seconds() / 3600
        if age_hours > 24:
            stale.append(f'{lock[\"story_id\"]}: locked by {lock.get(\"locked_by\", \"?\")} for {age_hours:.1f}h')
    if stale:
        print(f'::warning::Stale locks found (>24h):')
        for s in stale:
            print(f'  {s}')
else:
    print('No locks to validate')
"
          else:
            echo "::notice::specs/agent-locks.yaml not found — skipping stale-lock check"
          fi

      - name: Sync skills and verify artifacts committed
        run: |
          bash scripts/sync-skills.sh
          bash scripts/validate-doctrine.sh
          git diff --exit-code \
            .cursor/rules \
            .gemini/extensions/bigpowers \
            .pi \
            SKILL-INDEX.md \
            skills-lock.json \
            README.md \
            specs/SKILL-SEARCH-INDEX_LATEST.md || {
            echo "::error::Generated artifacts out of date. Run: bash scripts/sync-skills.sh && git add -A && git commit"
            git diff --stat .cursor/rules .gemini/extensions/bigpowers .pi SKILL-INDEX.md skills-lock.json README.md specs/SKILL-SEARCH-INDEX_LATEST.md
            exit 1
          }

      - name: Traceability gate (--strict)
        run: |
          if [ -f scripts/trace-stories.sh ]; then
            bash scripts/trace-stories.sh --strict --json
          else
            echo "::warning::trace-stories.sh not found — skipping traceability gate"
          fi

      - name: Upload traceability matrix
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: traceability-matrix
          path: specs/traceability-matrix.json

      - name: Validate OKF bundles (non-blocking)
        continue-on-error: true
        run: |
          if [ -f scripts/validate-okf.sh ]; then
            echo "::group::OKF validation — all directories"
            FAILED=0
            for dir in \
              specs/metrics \
              specs/migrations \
              specs/epics-wiki \
              specs/adr-wiki \
              specs/bugs \
              specs/verifications/reports; do
              if [ -d "$dir" ]; then
                echo "  Validating: $dir"
                bash scripts/validate-okf.sh --dir "$dir" || { echo "::warning::OKF issues in $dir"; FAILED=1; }
              fi
            done
            echo "::endgroup::"
            if [ "$FAILED" -eq 1 ]; then
              echo "::warning::OKF bundle validation found issues in one or more directories (non-blocking)"
            fi
          else
            echo "::notice::validate-okf.sh not found — skipping"
          fi
