# story: e38s03 BUG-2026-10-25-release-not-gated
# Third member of the v3 CI/CD pair. The gates live in test-build-release.yml;
# this workflow publishes only after that pipeline completed successfully on main,
# so a red gate can never release (BUG-2026-10-25-release-not-gated).
# It exists as its own workflow because the pipeline cancels superseded runs, and
# a cancellation during semantic-release leaves a tag without a published version.
# Never cancel this one.
name: Release

on:
  workflow_run:
    workflows: ["Test Build Release"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

# Never cancel a running semantic-release: a cancel after the tag push but before
# npm publish leaves a tagged, unpublished version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      # workflow_run does not check out the triggering commit by default.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
