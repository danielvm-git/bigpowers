# story: e51s04
# GitHub issue: #99 — wire anti-vacuity golden suite into CI
name: Golden Anti-Vacuity Suite

concurrency:
  group: golden-suite-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "0 3 * * *"  # Daily 03:00 UTC — fleet-wide anti-vacuity drift check
  pull_request:
    branches: [main, develop]
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/golden-suite.yml'
  workflow_dispatch:

jobs:
  verification-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python deps
        run: python3 -m pip install --user -r requirements.txt

      - name: Run verification gates (G-08/G-10 anti-vacuity)
        run: bash scripts/run-verification-gates.sh

  skill-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Blocking as of #96 landing on main (was advisory during the parallel
    # #96/#99 branches). This is the only place skill-verify gates a PR.
    steps:
      - uses: actions/checkout@v6

      - name: Run skill verify
        run: bash scripts/run-skill-verify.sh

      # Regression guard for BUG-2026-07-02T103911 class: macOS ships bash 3.2,
      # which lacks mapfile/declare -A. CI runs bash 5, so a 3.2-only breakage
      # is invisible here unless we assert POSIX-compatible constructs directly.
      - name: Assert runner is bash 3.2 compatible
        run: |
          # Strip comment lines first — the script documents these constructs
          # by name in its own comments, which must not trip the guard.
          if grep -vE '^[[:space:]]*#' scripts/run-skill-verify.sh \
             | grep -nE '(^|[;&|[:space:]])(mapfile|readarray)[[:space:]]|declare[[:space:]]+-A'; then
            echo "::error::bash 4+ construct in run-skill-verify.sh — breaks macOS bash 3.2"
            exit 1
          fi
          echo "OK: no bash 4+ only constructs"
