# story: e33s04
name: Deploy Docs Site to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'skills/*/SKILL.md'
      - 'docs/**'
      - 'specs/adr/**'
      - 'website/**'
      - 'README.md'
      - 'SKILL-INDEX.md'
      - '.github/workflows/docs-site.yml'
      - 'scripts/build-receipts.sh'
      - 'specs/receipts.json'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate receipts
        run: bash scripts/build-receipts.sh

      - name: Verify receipts.json
        run: |
          if [ ! -f specs/receipts.json ]; then
            echo "ERROR: receipts.json not generated"; exit 1
          fi
          python3 -c "import json; json.load(open('specs/receipts.json')); print('receipts.json: valid JSON')"

      - name: Build docs site
        run: |
          cd website
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
