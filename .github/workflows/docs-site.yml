# story: e33s04
name: Deploy Docs (GitHub Pages)

concurrency:
  group: pages
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'skills/*/SKILL.md'
      - 'docs/**'
      - 'specs/adr/**'
      - 'website/**'
      - 'README.md'
      - 'SKILL-INDEX.md'
      - '.github/workflows/docs-site.yml'
      - 'scripts/build-receipts.sh'
      - 'specs/receipts.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate receipts
        run: bash scripts/build-receipts.sh

      - name: Verify receipts.json
        run: |
          if [ ! -f specs/receipts.json ]; then
            echo "ERROR: receipts.json not generated"; exit 1
          fi
          python3 -c "import json; json.load(open('specs/receipts.json')); print('receipts.json: valid JSON')"

      - name: Build docs site
        run: |
          cd website
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_attempt_1.outputs.page_url || steps.deploy_attempt_2.outputs.page_url || steps.deploy_attempt_3.outputs.page_url || 'https://danielvm-git.github.io/bigpowers/' }}
    steps:
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_attempt_1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final deploy retry
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify deployment succeeded
        run: |
          if [ "${{ steps.deploy_attempt_1.outcome }}" = "success" ] || \
             [ "${{ steps.deploy_attempt_2.outcome }}" = "success" ] || \
             [ "${{ steps.deploy_attempt_3.outcome }}" = "success" ]; then
            echo "GitHub Pages deployment succeeded"
          else
            echo "::error::GitHub Pages deployment failed after 3 attempts"
            exit 1
          fi
